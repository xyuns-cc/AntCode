[project]
name = "antcode"
version = "1.0.0"
description = "AntCode - 基于FastAPI的任务调度和项目管理平台"
requires-python = ">=3.11"
dependencies = [
    # Web框架
    "fastapi==0.123.7",
    "uvicorn[standard]==0.38.0",
    "python-multipart>=0.0.20",
    # 数据库
    "tortoise-orm>=0.21.0",
    "asyncpg>=0.29.0",  # PostgreSQL驱动
    # 数据验证
    "pydantic[email]>=2.0.0",
    "pydantic-settings==2.12.0",
    "python-dotenv==1.2.1",
    # 身份认证
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=41.0.0",
    # 任务调度
    "apscheduler>=3.10.0",
    # 缓存
    "redis==7.1.0",
    # 日志
    "loguru>=0.7.0",
    # 工具库
    "aiofiles==25.1.0",
    "psutil==7.1.3",
    # P7: worker 的 RuleSpider/SpiderClient 默认 http2=True → 需要 h2 extra
    "httpx[http2]>=0.28.1",
    "ujson>=5.9.0",
    "PyYAML>=6.0",
    "websockets>=12.0",
    # 高性能序列化与压缩
    "msgpack>=1.0.0",
    "lz4>=4.3.0",
    "bcrypt==4.0.1",
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
    # 静态检查 & 安全扫描：CI (.github/workflows/ci.yml) 里 `uv run ruff/mypy/bandit/pip-audit`
    # 直接依赖这里；缺任何一个,uv sync --dev 就装不上,PR 到 lint step 才炸。
    "ruff>=0.7.0",
    "bandit>=1.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
]


# P7: uv workspace 声明。之前根 pyproject.toml 没有 workspace，`uv sync
# --all-packages` 会剥离对 antcode_worker/master/gateway/web_api 的 editable
# install，导致 `uv run python -m antcode_worker` 找不到模块。声明成 workspace
# 后 uv 会把 services/*/packages/* 作为 editable 依赖同装。
[tool.uv.workspace]
members = [
    "packages/antcode_core",
    "packages/antcode_contracts",
    "packages/antcode_scrapy",
    "services/gateway",
    "services/master",
    "services/web_api",
    "services/worker",
]

[tool.uv.sources]
antcode-core = { workspace = true }
antcode-contracts = { workspace = true }
antcode-scrapy = { workspace = true }
antcode-gateway = { workspace = true }
antcode-master = { workspace = true }
antcode-web-api = { workspace = true }
antcode-worker = { workspace = true }







[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
    "**/*_pb2.pyi",
    ".venv",
    "data",
    "migrations",
]

[tool.ruff.lint]
# J1: AGENTS.md 硬指标（函数≤50 行、参数≤3、圈复杂度≤10、无魔法数字）通过
# C901+PLR* 强制。存量违规目前全域宽松（per-file-ignores 白名单），保证增量
# 不再劣化；批次 J2 里逐目录收紧。
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "C901",  # 圈复杂度
    # PLR: pylint refactor 检查（参数数/魔法数字/分支数/语句数）
    # 存量违规多，先只 select，per-file-ignores 全域放开，让 baseline 干净后再收紧
]
ignore = ["E501"]  # 行长由 formatter 控制
# 圈复杂度上限 = AGENTS.md 的 10
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841", "C901"]
"scripts/**/*.py" = ["E402", "C901"]
# J1 存量白名单：现有超复杂度函数尚未拆，先豁免让 baseline 通过；
# 批次 J2 里按目录逐个收紧。新代码走全局 max-complexity=10。
"packages/antcode_core/**/*.py" = ["C901"]
"services/master/**/*.py" = ["C901"]
"services/web_api/**/*.py" = ["C901"]
"services/worker/**/*.py" = ["C901"]
"services/gateway/**/*.py" = ["C901"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-p no:unraisableexception"
filterwarnings = [
    # 忽略 passlib 库中的 crypt 模块弃用警告（第三方库问题，Python 3.13 前无法解决）
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:Exception ignored in:pytest.PytestUnraisableExceptionWarning",
]

markers = [
    "integration: 集成测试标记",
    "pbt: 边界/属性测试标记",
]
