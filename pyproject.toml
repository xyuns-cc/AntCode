[project]
name = "antcode"
version = "1.0.0"
description = "AntCode - 基于FastAPI的任务调度和项目管理平台"
requires-python = ">=3.11"
dependencies = [
    # Web框架
    "fastapi>=0.123.7",
    "uvicorn[standard]==0.52.3",
    "click>=8.3.3",  # 修复 PYSEC-2026-2132 / CVE-2026-7246
    "python-multipart>=0.0.31",
    "starlette>=1.0.1",
    # 数据库
    "tortoise-orm>=0.21.0",
    "asyncpg>=0.29.0",  # PostgreSQL驱动
    # 数据验证
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2",
    # 身份认证
    "pyjwt>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=48.0.1",
    # 任务调度
    "apscheduler>=3.10.0",
    # 缓存
    "redis==7.1.0",
    # 日志
    "loguru>=0.7.0",
    # 工具库
    "aiofiles==25.1.0",
    "psutil==7.1.3",
    # P7: worker 的 RuleSpider/SpiderClient 默认 http2=True → 需要 h2 extra
    "httpx[http2]>=0.28.1",
    "ujson>=5.13.0",
    "idna>=3.15",
    "PyYAML>=6.0",
    # 高性能序列化与压缩
    "msgpack>=1.2.1",
    "lz4>=4.3.0",
    "bcrypt==4.0.1",
    # gRPC
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",
    # 静态检查 & 安全扫描：CI (.github/workflows/ci.yml) 里 `uv run ruff/mypy/bandit/pip-audit`
    # 直接依赖这里；缺任何一个,uv sync --dev 就装不上,PR 到 lint step 才炸。
    "ruff>=0.7.0",
    "bandit>=1.8.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.3",
    "pygments>=2.20.0",
    "setuptools>=83.0.0",  # 修复 PYSEC-2026-3447（grpcio-tools 传递依赖）
]


# P7: uv workspace 声明。之前根 pyproject.toml 没有 workspace，`uv sync
# --all-packages` 会剥离对 antcode_worker/master/gateway/web_api 的 editable
# install，导致 `uv run python -m antcode_worker` 找不到模块。声明成 workspace
# 后 uv 会把 services/*/packages/* 作为 editable 依赖同装。
[tool.uv.workspace]
members = [
    "packages/antcode_core",
    "packages/antcode_contracts",
    "packages/antcode_scrapy",
    "services/gateway",
    "services/master",
    "services/web_api",
    "services/worker",
]

[tool.uv.sources]
antcode-core = { workspace = true }
antcode-contracts = { workspace = true }
antcode-scrapy = { workspace = true }
antcode-gateway = { workspace = true }
antcode-master = { workspace = true }
antcode-web-api = { workspace = true }
antcode-worker = { workspace = true }







[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "**/*_pb2.py",
    "**/*_pb2_grpc.py",
    "**/*_pb2.pyi",
    ".venv",
    "data",
    "migrations",
]

[tool.ruff.lint]
# 复杂度由 scripts.check_complexity 的显式函数级 baseline 统一执行。
# 不在这里启用 C901/PLR，避免为了兼容存量债务再次引入整目录 silent ignore。
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
]
ignore = ["E501"]  # 行长由 formatter 控制

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F401", "F841"]
"scripts/**/*.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--strict-markers"
pythonpath = ["."]
filterwarnings = [
    # 忽略 passlib 库中的 crypt 模块弃用警告（第三方库问题，Python 3.13 前无法解决）
    "ignore:'crypt' is deprecated:DeprecationWarning",
    # 后台任务、析构器和未 await 协程中的异常必须阻断测试，不能被全局隐藏。
    "error::pytest.PytestUnraisableExceptionWarning",
]

markers = [
    "integration: 集成测试标记",
    "e2e: 需要显式确认和专用测试环境的端到端测试",
    "pbt: 边界/属性测试标记",
    "transport(mode): Worker transport implementation covered by a contract test",
    "loadtest_scenario: guarded external load-test scenario",
    "loadtest_write: load-test scenario that creates or triggers tasks",
]
