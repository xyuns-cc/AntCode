# P0-03: 生产不可信 Worker 必须用 gVisor / Kata RuntimeClass,不依赖
# bwrap + SYS_ADMIN。以下 patch 在 base 之上打开 runtimeClassName。
# 前提:集群已安装 gvisor-node-installer 并注册 RuntimeClass name=runsc。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  template:
    spec:
      runtimeClassName: runsc  # 或 kata-containers
      nodeSelector:
        antcode.io/worker-pool: untrusted  # 独立 Node Pool
      tolerations:
        - key: antcode.io/untrusted
          operator: Equal
          value: "true"
          effect: NoSchedule
