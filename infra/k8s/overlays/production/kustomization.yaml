# P0-02 骨架:production overlay。
#
# 使用步骤:
# 1. 复制此目录为你的 site (如 overlays/prod-us-east/), 修改 namespace
# 2. 生成 secrets: kubectl create secret generic antcode-secrets --from-env-file=your.env
#    包含至少: DATABASE_USER / DATABASE_PASSWORD / REDIS_PASSWORD /
#    JWT_SECRET_KEY / ENCRYPTION_KEY / GATEWAY_TLS_CERT / GATEWAY_TLS_KEY /
#    WORKER_INSTALL_KEY / SESSION_SECRET
# 3. 生成 Gateway/Worker mTLS:
#    kubectl create secret tls gateway-tls --cert=server.crt --key=server.key
#    kubectl create secret generic worker-tls --from-file=ca.crt --from-file=client.crt --from-file=client.key
# 4. 覆盖 image tag (`newTag: v1.2.3`), 副本数, 资源限额
# 5. 校验: kubectl kustomize overlays/production/ | kubectl apply --dry-run=client -f -
# 6. 应用: kubectl kustomize overlays/production/ | kubectl apply -f -

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: antcode

resources:
  - ../../base

images:
  # 生产必须钉 immutable tag (semver + digest), 不用 :latest
  - name: antcode/gateway
    newTag: latest
  - name: antcode/master
    newTag: latest
  - name: antcode/worker
    newTag: latest
  - name: antcode/web-api
    newTag: latest

replicas:
  - name: gateway
    count: 3
  - name: master
    count: 2
  - name: web-api
    count: 3
  - name: worker
    count: 5

# 副本资源限额、Ingress host、StorageClass、runtimeClassName 应通过
# strategic merge patch 补齐; 见 patches/*.yaml
patches:
  - path: patches/worker-runtime-class.yaml
    target:
      kind: Deployment
      name: worker

configMapGenerator:
  - name: antcode-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - ANTCODE_TRUSTED_PROXIES=10.0.0.0/8  # 覆盖为你的 Ingress controller CIDR
