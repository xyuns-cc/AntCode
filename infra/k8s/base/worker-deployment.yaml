# P0-02 骨架:Worker 池。生产不可信任务隔离要点(见 docs/k8s-deployment.md):
# - 用 gVisor (runsc) 或 Kata Containers 作为 Pod RuntimeClass,不给 SYS_ADMIN
# - 独立 nodeSelector/taint 放到不可信 Node Pool,与控制面隔离
# - NetworkPolicy 只放通对 Gateway 的 gRPC 出向
# - Rule 网络默认关(ANTCODE_RULE_ALLOW_NETWORK=0),需 egress-proxy 才开启
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      # runtimeClassName: runsc  # overlay 应显式指定 gVisor / Kata
      securityContext:
        runAsUser: 10003
        runAsGroup: 10003
        runAsNonRoot: true
        # 不设 seccompProfile: RuntimeDefault, bwrap 嵌套 namespace 需要 unconfined
      containers:
        - name: worker
          image: antcode/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: antcode-config
            - secretRef:
                name: antcode-secrets
          env:
            - name: WORKER_GATEWAY_ENDPOINT
              value: "gateway.antcode.svc.cluster.local:50051"
          volumeMounts:
            - name: worker-data
              mountPath: /var/lib/antcode
            - name: tls-client
              mountPath: /etc/antcode/tls
              readOnly: true
          readinessProbe:
            exec:
              command: ["pgrep", "-f", "antcode_worker"]
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            # bwrap 嵌套 namespace 需要 SYS_ADMIN。生产运行时用 gVisor/Kata 后
            # 可去掉此 cap_add,由运行时提供内核级隔离。
            capabilities:
              add: ["SYS_ADMIN"]
              drop: ["ALL"]
      volumes:
        - name: worker-data
          emptyDir:
            sizeLimit: 20Gi
        - name: tls-client
          secret:
            secretName: worker-tls
