# P0-02 骨架:Ingress。overlay 必须补齐 host / cert-manager annotation。
# Web API (HTTP) 与 Gateway (gRPC) 分开,通常也不共享一个 Ingress。
# gRPC Ingress 需要 nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-api
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # nginx.ingress.kubernetes.io/enable-cors: "false"
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - antcode.example.com  # overlay 覆盖
      secretName: web-api-tls
  rules:
    - host: antcode.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-api
                port:
                  number: 8000
---
# Gateway 通常暴露到 LoadBalancer 或独立 Ingress class(nginx-grpc),
# 而非常规 HTTP Ingress。生产建议直接用 Service type=LoadBalancer + 云商 TLS。
# 下面的 Ingress 只作 HTTP/2 gRPC 桥接示例。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - gateway.antcode.example.com
      secretName: gateway-ingress-tls
  rules:
    - host: gateway.antcode.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 50051
