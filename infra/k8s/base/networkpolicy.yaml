# P0-02 骨架:默认拒绝所有流量,再按角色显式放通。
# 前提:Node/CNI 支持 NetworkPolicy (Calico/Cilium/Antrea)。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Web API: 允许 Ingress controller 进,DB/Redis 出
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports: [{port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports: [{port: 6379}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports: [{port: 50051}]
    # DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# Gateway: 允许 Ingress + Worker 进,DB/Redis 出
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: worker
      ports:
        - port: 50051
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports: [{port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports: [{port: 6379}]
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# Master: 只需 DB/Redis 出
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: master
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: master
  policyTypes: [Ingress, Egress]
  ingress: []  # 无 ingress,仅内部指标端口 9100 (通过 metrics scraper 加白)
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports: [{port: 5432}]
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports: [{port: 6379}]
    - to: []
      ports:
        - protocol: UDP
          port: 53
---
# Worker: 只需 Gateway 出 + DNS。P0-03 关键:不可信任务不应有 Redis/PG 直连
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: worker
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports: [{port: 50051}]
    - to: []
      ports:
        - protocol: UDP
          port: 53
    # ANTCODE_RULE_ALLOW_NETWORK=1 场景另需 egress-proxy 白名单,
    # 由 overlay 追加,不进 base。
