# P0-02 骨架:PG 备份 CronJob 到对象存储。生产建议改为托管数据库自动
# 备份(RDS/Cloud SQL),或用 Velero/CloudNativePG 提供 PITR。
# 需在 antcode-secrets 里补 S3 access key、bucket、加密密钥。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: antcode-pg-backup
spec:
  schedule: "17 3 * * *"  # 每天 03:17 UTC (避开高峰,非整点错峰)
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
          containers:
            - name: pg-backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  DATE=$(date -u +%Y%m%d-%H%M%S)
                  FILE="/tmp/antcode-${DATE}.sql.gz"
                  pg_dump -h "$DATABASE_HOST" -U "$POSTGRES_USER" -d "$DATABASE_NAME" \
                      --format=custom --compress=9 -f "/tmp/antcode-${DATE}.dump"
                  gzip "/tmp/antcode-${DATE}.dump"
                  # overlay 需注入 aws / mc / gcloud CLI + 上传命令
                  echo "backup created at $FILE — implement upload in overlay"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: antcode-secrets
                      key: DATABASE_PASSWORD
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: antcode-secrets
                      key: DATABASE_USER
                - name: DATABASE_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: antcode-config
                      key: DATABASE_HOST
                - name: DATABASE_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: antcode-config
                      key: DATABASE_NAME
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
