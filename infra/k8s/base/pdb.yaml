# P0-02 骨架:PDB 保证滚动升级/节点排空时至少一个副本可服务。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: master
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: master
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
spec:
  # Worker 允许更多 disruption(单次最多让 25% 副本下线)
  maxUnavailable: "25%"
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
