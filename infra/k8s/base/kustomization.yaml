# AntCode 生产 K8s base 骨架 (P0-02)
#
# 此 base 只提供**骨架**:
# - 副本数、镜像 tag、资源限额、secret 值都通过 overlay 覆盖
# - 不含实际业务参数,由 overlays/<site>/ 提供 ConfigMap/Secret
# - 网络策略、Ingress、PDB、备份 CronJob 也在 overlay 具化
#
# 迁移路径见 docs/k8s-deployment.md;compose (dev/remote) 与 K8s 不共享
# 配置,不要期望复用 infra/docker/.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: antcode

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: antcode

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres-statefulset.yaml
  - redis-statefulset.yaml
  - gateway-deployment.yaml
  - master-deployment.yaml
  - worker-deployment.yaml
  - web-api-deployment.yaml
  - services.yaml
  - ingress.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - migration-job.yaml
  - backup-cronjob.yaml
