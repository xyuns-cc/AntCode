# P0-02 骨架:数据库迁移 Job。在 Master/Web API 启动前跑一次,
# 复用 web-api 镜像 (含 scripts/init_db.py + migrations/*.sql)。
# 用 Argo Rollouts/Helm hooks 时应改为 pre-install/pre-upgrade hook。
apiVersion: batch/v1
kind: Job
metadata:
  name: antcode-migrate
  annotations:
    # kustomize 每次 build 都会带这份 Job;实际发布用 Argo/Helm 时改为 hook
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10004
        runAsNonRoot: true
      containers:
        - name: migrate
          image: antcode/web-api:latest
          command: ["python", "-m", "scripts.init_db"]
          envFrom:
            - configMapRef:
                name: antcode-config
            - secretRef:
                name: antcode-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
