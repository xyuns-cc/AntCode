# =====================================================
# AntCode 多服务架构 - 开发环境 Docker Compose
# =====================================================
# 服务架构:
#   - web_api (Control Plane): HTTP API + SSE 日志流
#   - master (Schedule Plane): 调度循环 + 一致性维护
#   - gateway (Data Plane): 公网 Worker 接入 (gRPC/TLS)
#   - worker (Execution Plane): 任务执行器
# =====================================================

# 所有 antcode 应用服务共用：json-file 日志轮转，防止长跑撑爆宿主机磁盘。
x-antcode-logging: &antcode-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # ================== 基础设施服务 ==================

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: antcode-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-antcode}
      POSTGRES_USER: ${POSTGRES_USER:-antcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antcode} -d ${POSTGRES_DB:-antcode}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis 缓存与消息队列
  # dev 也持久化 ACL 文件，确保 Direct Worker 永远只拿独立最小权限账号。
  redis:
    image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: antcode-redis
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        acl_file=/etc/redis-acl/users.acl
        if [ ! -s "$${acl_file}" ]; then
          printf 'user default on >%s ~* &* +@all\n' "$${REDIS_PASSWORD}" > "$${acl_file}"
        fi
        chown redis:redis "$${acl_file}"
        chmod 600 "$${acl_file}"
        # ACL SAVE 是原子写：先在同目录建临时文件再 rename，因此 redis 需要对
        # **目录**有写权限。只 chown 文件的话，ACL SAVE 恒报
        # "Opening temp ACL file for ACL SAVE: Permission denied"，
        # master 启动时签发 Worker ACL 直接失败、容器永远 unhealthy。
        chown redis:redis "$${acl_file%/*}"
        exec /usr/local/bin/docker-entrypoint.sh \
          redis-server --appendonly yes --aclfile "$${acl_file}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}
    volumes:
      - redis_data:/data
      - redis_acl:/etc/redis-acl
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ================== 应用服务 ==================

  # 数据库结构初始化/升级必须先于所有数据库消费者完成。
  migration:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web_api
    image: antcode-web-api:dev
    container_name: antcode-migration
    restart: "no"
    logging: *antcode-logging
    env_file:
      - path: ./.env
        required: false
      - path: ../../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-antcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${POSTGRES_DB:-antcode}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}@redis:6379/0
      - REDIS_ACL_ENABLED=true
    command: ["python", "-m", "scripts.init_db"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antcode-network

  # 显式运维工具，不随常驻服务自动启动。先停写，再用 docker compose run 调用。
  crawl-redis-upgrade:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web_api
    image: antcode-web-api:dev
    profiles: ["crawl-redis-upgrade"]
    restart: "no"
    logging: *antcode-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /tmp
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}@redis:6379/0
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:?REDIS_NAMESPACE must be set and non-empty}
    command: ["python", "-m", "scripts.migrate_crawl_redis"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - antcode-network

  # Web API 服务 (Control Plane)
  web-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web_api
    image: antcode-web-api:dev
    container_name: antcode-web-api
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    # 资源上限为开发环境保守默认值，可按宿主机规格调整
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    ports:
      - "127.0.0.1:${WEB_API_PORT:-8000}:8000"
    env_file:
      # 应用配置注入链（两个文件都允许缺失，缺必填密钥时服务 fail-fast 并指明变量名）：
      #   1) infra/docker/.env —— cp .env.example .env 后填必填项即可只用此一份
      #   2) 项目根 .env       —— 本地开发同款配置；同名变量以【根 .env】为准
      - path: ./.env
        required: false
      - path: ../../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-antcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${POSTGRES_DB:-antcode}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}@redis:6379/0
      - REDIS_ACL_ENABLED=true
      # 容器内监听地址/端口固定：宿主端口映射与下方 healthcheck 都假设容器内 8000。
      # 根 .env 里改 SERVER_PORT/BIND_HOST 只影响本地裸跑，不影响容器（此处显式覆盖）。
      - SERVER_PORT=8000
      - BIND_HOST=0.0.0.0
    volumes:
      - web_data:/app/data
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Master 调度服务 (Schedule Plane)
  master:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.master
    image: antcode-master:dev
    container_name: antcode-master
    restart: unless-stopped
    logging: *antcode-logging
    # 资源上限为开发环境保守默认值，可按宿主机规格调整
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    env_file:
      - path: ./.env
        required: false
      - path: ../../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-antcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${POSTGRES_DB:-antcode}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}@redis:6379/0
      - REDIS_ACL_ENABLED=true
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Gateway 网关服务 (Data Plane)
  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    image: antcode-gateway:dev
    container_name: antcode-gateway
    restart: unless-stopped
    logging: *antcode-logging
    # 资源上限为开发环境保守默认值，可按宿主机规格调整
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    ports:
      - "127.0.0.1:${GATEWAY_GRPC_PORT:-50051}:50051"
    env_file:
      # 注入链同 web-api：docker .env → 项目根 .env（根 .env 优先）
      - path: ./.env
        required: false
      - path: ../../.env
        required: false
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-antcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${POSTGRES_DB:-antcode}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set and non-empty}@redis:6379/0
      - REDIS_ACL_ENABLED=true
      - GRPC_PORT=50051
      # dev compose 内网 127.0.0.1:50051，无对外 TLS；显式声明允许明文启动
      # 生产严禁：明文端口 + AUTH_ENABLED = 凭证挂到公网。
      - ANTCODE_GATEWAY_ALLOW_INSECURE=true
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # Worker 执行器服务 (Execution Plane) - Direct 模式
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    image: antcode-worker:dev
    container_name: antcode-worker
    restart: unless-stopped
    # Worker 停机 drain 需要 30/35 秒（services/worker/app/main.py 的排空逻辑），
    # compose 默认 10s 就 SIGKILL 会截断在途任务上报；留 45s 余量。
    stop_grace_period: 45s
    logging: *antcode-logging
    # Worker 会派生沙箱内爬虫进程，配额高于控制面服务；可按宿主机规格调整
    cpus: 4
    mem_limit: 4g
    pids_limit: 2048
    # 沙箱 fail-closed 的宿主前提，必须显式声明（详细推导见
    # docker-compose.prod.worker.yml 同名字段）：preexec_fn 对每个任务子进程
    # setrlimit(RLIMIT_NOFILE, 2048)，宿主 dockerd 默认 nofile hard < 2048 时
    # 直接抛 "current limit exceeds maximum limit"，Worker 拒绝执行任何任务。
    # 65536 = 2048 硬性下限 + Worker 父进程自身的 fd 余量。
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    read_only: true
    cap_drop:
      - ALL
    # bwrap 的非特权 user namespace 在 Docker 下需要三项放宽，缺任何一项
    # 任务都会 100% 失败（真机实测：默认画像下每个任务都以
    # "bwrap: No permissions to create new namespace" 退出）：
    #   1) seccomp：Docker 内置 profile 在无 CAP_SYS_ADMIN 时禁止 clone/unshare
    #      带 CLONE_NEWUSER。这里用的是**定制 profile**（内置 profile 仅放行
    #      namespace 相关调用），不是 unconfined，其余系统调用过滤全部保留。
    #   2) apparmor：docker-default 直接 deny mount，bwrap 连 / 都改不成 slave。
    #   3) systempaths：Docker 对 /proc 的屏蔽挂载会让 userns 内挂 procfs 失败。
    # 仍然保留的硬边界：cap_drop ALL、no-new-privileges、只读根、非 root 运行。
    # 改动这三行前请先在目标宿主跑通真实任务，否则等于静默关掉整个执行面。
    security_opt:
      - no-new-privileges:true
      - seccomp:./seccomp/worker-userns.json
      - apparmor=unconfined
      - systempaths=unconfined
    shm_size: 1g
    tmpfs:
      - /tmp:exec,uid=1000,gid=1000,mode=1777
      - /home/appuser/.cache:exec,uid=1000,gid=1000,mode=0700
    environment:
      - REDIS_ACL_ENABLED=true
      - ANTCODE_WORKER_KEY=${ANTCODE_WORKER_KEY:?generate a one-time Worker install key first}
      - WORKER_TRANSPORT_MODE=direct
      # Direct 模式的产物平面是 PostgresArtifactTransferStore（app/wiring.py::
      # _create_artifact_transfer_store），源码包下载与产物上传都直连 PG blob
      # 存储，所以 DATABASE_URL 是必需的——而 Redis 侧相反，Worker 只能拿
      # WORKER_REDIS_URL 那个独立最小权限 ACL 账号，绝不给控制面 REDIS_URL。
      # 该非对称边界由 WORKER_DIRECT_SCOPED_REDIS 在 Settings 里 fail-closed 校验。
      - WORKER_DIRECT_SCOPED_REDIS=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-antcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set and non-empty}@postgres:5432/${POSTGRES_DB:-antcode}
      - WORKER_NAME=${WORKER_NAME:-worker-1}
      # 容器内观测端口固定 8001（Dockerfile.worker HEALTHCHECK 假设 8001）
      - WORKER_PORT=8001
      - WORKER_SANDBOX_MODE=sandbox
      - WORKER_SANDBOX_COMMAND=bwrap
      - WORKER_SANDBOX_NETWORK_ISOLATED=true
      # direct 模式必需：worker config 只读 WORKER_REDIS_URL，不读 REDIS_URL
      - WORKER_REDIS_URL=redis://redis:6379/0
      - WORKER_API_BASE_URL=http://web-api:8000
      - WORKER_API_ALLOW_INSECURE_INTERNAL=true
    volumes:
      - worker_data:/app/data
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    depends_on:
      redis:
        condition: service_healthy
      # 产物平面直连 PG，依赖显式化（web-api 已隐含 migration 完成，此处只补直连事实）
      postgres:
        condition: service_healthy
      web-api:
        condition: service_healthy
    networks:
      - antcode-network
    # 与生产同构：只有 /health/live（引擎停 / 传输被永久 halt）连续失败才重启，
    # /health/ready 只决定 health 状态。详见 docker-compose.prod.worker.yml。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 6 60
          'curl -fsS --max-time 4 http://127.0.0.1:8001/health/live >/dev/null'
          && curl -fsS --max-time 4 http://127.0.0.1:8001/health/ready >/dev/null
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 60s

  # ================== 前端服务 ==================

  frontend:
    build:
      context: ../../web/antcode-frontend
      dockerfile: Dockerfile
    image: antcode-frontend:dev
    container_name: antcode-frontend
    restart: unless-stopped
    logging: *antcode-logging
    # 静态资源 nginx，资源占用极小；可按宿主机规格调整
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    ports:
      # J4: 容器内 nginx-unprivileged 监听 8080
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      web-api:
        condition: service_healthy
    networks:
      - antcode-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

# ================== 网络配置 ==================
networks:
  antcode-network:
    driver: bridge

# ================== 数据卷 ==================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  redis_acl:
    driver: local
  worker_data:
    driver: local
  web_data:
    driver: local
