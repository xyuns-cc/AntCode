services:
  postgres:
    extends:
      file: docker-compose.prod.middleware.yml
      service: postgres
  redis:
    extends:
      file: docker-compose.prod.middleware.yml
      service: redis
  migration:
    extends:
      file: docker-compose.prod.middleware.yml
      service: migration
  crawl-redis-upgrade:
    extends:
      file: docker-compose.prod.middleware.yml
      service: crawl-redis-upgrade
  web-api:
    extends:
      file: docker-compose.prod.control.yml
      service: web-api
  master:
    extends:
      file: docker-compose.prod.control.yml
      service: master
  gateway:
    extends:
      file: docker-compose.prod.control.yml
      service: gateway
  worker:
    extends:
      file: docker-compose.prod.worker.yml
      service: worker
    profiles: ["co-located-worker"]
    # 同机 Worker 不出公网：走 antcode-execution 的内嵌 DNS 直连 gateway 容器。
    # 主机名与端口必须一起覆盖——基线文件里的 WORKER_GATEWAY_PORT 是
    # ANTCODE_GATEWAY_PUBLIC_PORT（宿主发布端口），容器内 gateway 恒定监听
    # GRPC_PORT=50051（docker-compose.prod.control.yml），两者不等时同机 Worker
    # 会去敲一个网络内根本没有监听的端口。
    # WORKER_GATEWAY_TLS 保持 true，因此 Gateway 服务端证书的 SAN 必须同时包含
    # 公网 FQDN 与 DNS:gateway——只签公网 FQDN 时同机 Worker 每次握手都会因为
    # 主机名不匹配而失败。
    environment:
      WORKER_GATEWAY_HOST: gateway
      WORKER_GATEWAY_PORT: "50051"
    networks:
      - antcode-execution
    depends_on:
      web-api:
        condition: service_healthy
      gateway:
        condition: service_healthy
  frontend:
    extends:
      file: docker-compose.prod.edge.yml
      service: frontend
    environment:
      WEB_API_UPSTREAM: web-api:8000
      TRUSTED_EDGE_PROXY_IP: ${ANTCODE_REVERSE_PROXY_EDGE_IP:?exact reverse proxy edge-network IP is required}
    networks:
      antcode-control:
        ipv4_address: ${ANTCODE_FRONTEND_CONTROL_IP:?exact frontend control-network IP is required}
      antcode-edge: {}
  reverse-proxy:
    extends:
      file: docker-compose.prod.edge.yml
      service: reverse-proxy
    networks:
      antcode-edge:
        ipv4_address: ${ANTCODE_REVERSE_PROXY_EDGE_IP:?exact reverse proxy edge-network IP is required}

# frontend 与 reverse-proxy 各自 pin 死一个 IP，因为 Web API 只信任 frontend 的精确
# control IP、frontend 只信任 reverse-proxy 的精确 edge IP。但 Docker 的动态 IPAM 从网
# 段低位开始分配，且**不知道**同项目里还有别的容器 pin 了地址：postgres/redis 先于
# frontend 创建（deploy-production.sh:58 先起中间件），必然抢走网段第一个可用地址，
# 也就是 pin 给 frontend 的那个——首次部署 100% 以
# "failed to set up container networking: Address already in use" 失败（真机实测）。
# edge 网同理：frontend 先于 reverse-proxy 创建，会抢走 pin 给 reverse-proxy 的地址。
# ip_range 把动态池限死在网段的一个子区间，pin 的地址落在池外就不再是"祈祷没人先抢"
# 的隐式依赖，而是声明式契约（tests/unit/core/test_docker_compose_prod_contract.py 锁住）。
networks:
  antcode-control:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${ANTCODE_CONTROL_SUBNET:?dedicated control-network subnet is required}
          ip_range: ${ANTCODE_CONTROL_DYNAMIC_RANGE:?control-network dynamic range excluding the pinned frontend IP is required}
  antcode-service-egress:
    driver: bridge
  antcode-execution:
    driver: bridge
  antcode-edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${ANTCODE_EDGE_SUBNET:?dedicated edge-network subnet is required}
          ip_range: ${ANTCODE_EDGE_DYNAMIC_RANGE:?edge-network dynamic range excluding the pinned reverse proxy IP is required}

volumes:
  web_data:
  master_data:
  gateway_data:
  worker_data:
    name: ${ANTCODE_WORKER_DATA_VOLUME:?unique Worker data volume is required}
  postgres_data:
  redis_data:

secrets:
  database_url:
    file: ${ANTCODE_DATABASE_URL_FILE:?host DATABASE_URL secret file is required}
  redis_url:
    file: ${ANTCODE_REDIS_URL_FILE:?host REDIS_URL secret file is required}
  encryption_key:
    file: ${ANTCODE_ENCRYPTION_KEY_FILE:?host encryption key secret file is required}
  encryption_key_salt:
    file: ${ANTCODE_ENCRYPTION_KEY_SALT_FILE:?host encryption key salt secret file is required}
  encryption_keys_legacy:
    file: ${ANTCODE_ENCRYPTION_KEYS_LEGACY_FILE:?host legacy encryption keys file is required}
  jwt_secret:
    file: ${ANTCODE_JWT_SECRET_FILE:?host JWT secret file is required}
  postgres_password:
    file: ${ANTCODE_POSTGRES_PASSWORD_FILE:?host PostgreSQL password file is required}
  redis_healthcheck_password:
    file: ${ANTCODE_REDIS_HEALTHCHECK_PASSWORD_FILE:?host Redis healthcheck password file is required}
