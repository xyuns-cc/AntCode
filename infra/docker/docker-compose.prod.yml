# AntCode 生产 Compose 骨架 (round6 P0-03: 替代 K8s 决策后的非 K8s 生产画像)
#
# 定位:此文件是"生产就绪的最小起点",不是可直接 docker compose up 上线的
# 交钥匙方案。上线前必须完成 8 个 site-specific 落地(见 infra/docker/README.md
# 的"生产部署合同"章节)。dev/remote 画像禁止直接改名当生产用。
#
# 与 remote 画像的关键差异(强制):
# - 全 HTTPS(反向代理 TLS 终止;Compose 内部无明文端口对外)
# - AUTH_COOKIE_SECURE=true (强制 Secure Cookie)
# - REDIS_ACL_ENABLED=true  (Worker/服务用最小权限 ACL 账号)
# - ANTCODE_GATEWAY_ALLOW_INSECURE=false (Gateway mTLS 硬开)
# - WORKER_GATEWAY_TLS=true
# - Worker Rule 网络默认关(ANTCODE_RULE_ALLOW_NETWORK 由 site 显式打开)
# - Legacy settle 通道关闭 (ANTCODE_GATEWAY_LEGACY_SETTLE_UNTIL_TS 已过去)
# - 备份 sidecar 已配 (pg_dump → 对象存储/远程盘)
#
# Site-specific 落地清单(此文件默认全部空,site 通过 override 或
# .env.production 填):
# 1. DATABASE_URL / REDIS_URL 走同一 VPC 内的托管 PG/Redis,或 stateful
#    volume + 内部 network(pg/redis 服务不 expose 端口)
# 2. TLS 证书从 secret 或 host bind 挂载,非 emptyDir
# 3. Ingress: nginx/traefik/caddy 反向代理,http-01/dns-01 自动续签
# 4. Worker mTLS:每 Worker 独立客户端证书(installer 生成后单独挂)
# 5. 镜像 tag 用 immutable digest 或语义化版本,不用 latest
# 6. 备份: pg_dump 定时(cron container/host cron) + 上传对象存储
# 7. 监控: prometheus scrape /metrics + alertmanager 接入
# 8. 日志: json-file 轮转已配,site 按需接 filebeat/fluent-bit
#
# 参考验证: docker compose -f docker-compose.prod.yml config 检查语法

x-antcode-logging: &antcode-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

# 通用生产环境变量(全服务共享)
x-antcode-prod-env: &antcode-prod-env
  # === 强制安全开关(不允许 site override 关闭) ===
  AUTH_COOKIE_SECURE: "true"
  REDIS_ACL_ENABLED: "true"
  ANTCODE_GATEWAY_ALLOW_INSECURE: "false"
  # === 中间件(site 通过 .env.production 提供) ===
  DATABASE_URL: ${DATABASE_URL:?生产 DATABASE_URL 必须显式配置}
  REDIS_URL: ${REDIS_URL:?生产 REDIS_URL 必须显式配置}
  # === Legacy 通道关闭时点(round6 P1-GW-06: 默认过去) ===
  ANTCODE_GATEWAY_LEGACY_SETTLE_UNTIL_TS: ${ANTCODE_GATEWAY_LEGACY_SETTLE_UNTIL_TS:-1}
  # === 日志级别(生产不 debug) ===
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  web-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web_api
    image: ${ANTCODE_IMAGE_REGISTRY:-ghcr.io/antcode}/antcode-web-api:${ANTCODE_IMAGE_TAG:?ANTCODE_IMAGE_TAG 必须显式}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    read_only: true
    tmpfs:
      - /tmp
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    # 生产不 expose 端口: 反向代理通过内部 network 转发
    expose:
      - "8000"
    env_file:
      - ../../.env.production
    environment:
      <<: *antcode-prod-env
      BIND_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      SERVER_RELOAD: "false"
    volumes:
      - web_data:/app/data
    networks:
      - antcode-internal
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  master:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.master
    image: ${ANTCODE_IMAGE_REGISTRY:-ghcr.io/antcode}/antcode-master:${ANTCODE_IMAGE_TAG:?}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    read_only: true
    tmpfs:
      - /tmp
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    env_file:
      - ../../.env.production
    environment:
      <<: *antcode-prod-env
    volumes:
      - master_data:/app/data
    networks:
      - antcode-internal
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8101/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    image: ${ANTCODE_IMAGE_REGISTRY:-ghcr.io/antcode}/antcode-gateway:${ANTCODE_IMAGE_TAG:?}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    expose:
      - "50051"
    env_file:
      - ../../.env.production
    environment:
      <<: *antcode-prod-env
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      WORKER_GATEWAY_TLS: "true"
      GATEWAY_TLS_CERT_PATH: /etc/antcode/tls/server.crt
      GATEWAY_TLS_KEY_PATH: /etc/antcode/tls/server.key
      GATEWAY_TLS_CA_PATH: /etc/antcode/tls/ca.crt
    volumes:
      - ${ANTCODE_GATEWAY_TLS_DIR:?生产 Gateway 必须挂载 mTLS 目录}:/etc/antcode/tls:ro
      - gateway_data:/app/data
    networks:
      - antcode-internal
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50051", "-tls", "-tls-ca-cert=/etc/antcode/tls/ca.crt"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 生产 Worker: SYS_ADMIN 是 bwrap 嵌套 namespace 硬需求
  # 但必须配合 Rule 网络默认关 + credential mask 扩展 + 独立 Node/Pool
  # 承接不可信任务时应更进一步 (gVisor/Kata) 或独立主机
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    image: ${ANTCODE_IMAGE_REGISTRY:-ghcr.io/antcode}/antcode-worker:${ANTCODE_IMAGE_TAG:?}
    restart: unless-stopped
    stop_grace_period: 60s  # 长任务给宽松 grace
    logging: *antcode-logging
    cpus: 4
    mem_limit: 8g
    pids_limit: 4096
    # bwrap 嵌套 namespace 硬需求(参见 README.md);上线前必须结合独立 Node
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    env_file:
      - ../../.env.production
    environment:
      <<: *antcode-prod-env
      WORKER_TRANSPORT_MODE: gateway
      WORKER_GATEWAY_TLS: "true"
      WORKER_GATEWAY_HOST: ${GATEWAY_HOST:-gateway}
      WORKER_GATEWAY_PORT: "50051"
      # Rule 网络默认关: 若 site 需要则显式设 1/true/yes
      ANTCODE_RULE_ALLOW_NETWORK: ${ANTCODE_RULE_ALLOW_NETWORK:-0}
      WORKER_SANDBOX_COMMAND: bwrap
    volumes:
      - ${ANTCODE_WORKER_TLS_DIR:?生产 Worker mTLS 必须显式挂载}:/etc/antcode/tls:ro
      - worker_data:/app/data
    networks:
      - antcode-internal
    depends_on:
      - gateway

  # === 反向代理 (site 可换 nginx/traefik/caddy) ===
  # 骨架只声明 service, site 通过 override 或独立文件补 nginx.conf/traefik 配置
  reverse-proxy:
    image: ${ANTCODE_REVERSE_PROXY_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HTTPS_PORT:-443}:443"
      - "0.0.0.0:${HTTP_REDIRECT_PORT:-80}:80"
    volumes:
      - ${ANTCODE_REVERSE_PROXY_CONFIG:?反向代理配置必须显式挂载}:/etc/nginx/nginx.conf:ro
      - ${ANTCODE_TLS_CERTS_DIR:?反向代理 TLS 证书必须显式挂载}:/etc/nginx/certs:ro
    networks:
      - antcode-internal
      - antcode-edge
    depends_on:
      - web-api
      - gateway
    logging: *antcode-logging

  # === PostgreSQL (site 可换托管) ===
  postgres:
    image: ${ANTCODE_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *antcode-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-antcode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - antcode-internal
    # 生产不 expose (内部 network only)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === Redis (site 可换托管/Cluster) ===
  redis:
    image: ${ANTCODE_REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?生产 Redis 必须启用 requirepass}
    volumes:
      - redis_data:/data
    networks:
      - antcode-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # === 备份 sidecar (骨架, site 补 cron + 上传逻辑) ===
  # 每日 pg_dump; site 通过 override 补上传目标(S3/OSS/rsync)
  backup:
    image: ${ANTCODE_POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    logging: *antcode-logging
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-antcode}
    volumes:
      - backup_data:/backup
    networks:
      - antcode-internal
    depends_on:
      - postgres
    # 骨架命令: 每 24h pg_dump 一次;site 应用 override 补 rclone/aws s3 上传
    command:
      - sh
      - -c
      - |
        while true; do
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump \
            -h "$$POSTGRES_HOST" -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
            -Fc -f "/backup/antcode-$$(date +%%Y%%m%%dT%%H%%M%%SZ).dump"
          # TODO(site): 上传到远端对象存储
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) backup done"
          sleep 86400
        done

networks:
  # 内部网络: 应用 + 中间件 + 反向代理; 不暴露宿主
  antcode-internal:
    driver: bridge
    internal: false  # 允许 site egress(如 pip/npm 拉包);上线可改 true 强制 egress-proxy
  # 边缘网络: 反向代理对外暴露 443/80
  antcode-edge:
    driver: bridge

volumes:
  web_data:
  master_data:
  gateway_data:
  worker_data:
  postgres_data:
  redis_data:
  backup_data:
