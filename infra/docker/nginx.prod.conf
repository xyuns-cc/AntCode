worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    # upstream 块 / 字面 proxy_pass 主机名都只在加载配置时解析一次并永久缓存。
    # frontend 在 edge 网上拿的是动态地址（只有 reverse-proxy 自己 pin 了 IP），
    # 只要 frontend 被重建（镜像 digest 变化即会），本进程就会一直打到旧地址；
    # compose 默认不会连带重建依赖方，所以这个错误状态不会自愈。
    # 走变量 + Docker 内嵌 DNS（127.0.0.11，所有用户自定义网络恒定提供）让每次
    # 请求重新解析；valid=10s 限定缓存窗口。代价是失去 upstream keepalive 池，
    # 边缘到 frontend 是同网段短链路，重连成本可以接受。
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        return 308 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        client_max_body_size 100m;
        limit_conn connections_per_ip 100;
        set $antcode_frontend frontend:8080;

        # web_api 的 SecurityHeadersMiddleware、frontend 的 nginx、以及本反代三层
        # 各自都会设这组头。nginx 的 add_header 是"追加"而不是"覆盖"，直接透传
        # 上游的同名头会让客户端收到三份 X-Content-Type-Options / X-Frame-Options /
        # Referrer-Policy 与两份 HSTS（真机 curl 实测）。RFC 7034 §2.1 明确
        # 多值 X-Frame-Options 无效，浏览器可以直接忽略整条头——"加固三遍"
        # 反而可能一遍都不生效。
        # 各层保留自己的 add_header（各自作为最外层时仍需生效），由最外层的公网
        # 反代先隐藏上游同名头、再添加唯一一份，把去重责任放在唯一面向客户端的位置。
        # 注意不要隐藏 Content-Security-Policy：本反代不提供 CSP，隐藏它等于把
        # frontend 那份真正约束页面的 CSP 直接抹掉。
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ ^/api/v1/logs/runs/[^/]+/stream$ {
            proxy_pass http://$antcode_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=100 nodelay;
            proxy_pass http://$antcode_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_request_buffering off;
        }

        location / {
            proxy_pass http://$antcode_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # /healthz 是纯本地存活探针（配置装载成功即 204），失败说明本进程坏了，
    # compose healthcheck 会据此 `kill -TERM 1` 让 restart 策略把它拉起来。
    # /healthz/upstream 才是真实链路探针：穿过 frontend 一路打到 Web API 的
    # /api/v1/health。两者分开是因为上游故障不该把边缘反代打进重启循环——
    # 那会把"API 不可用"升级成"整站连不上"。
    server {
        listen 127.0.0.1:8081;
        set $antcode_frontend frontend:8080;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /healthz/upstream {
            access_log off;
            proxy_pass http://$antcode_frontend/api/v1/health;
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }
    }
}
