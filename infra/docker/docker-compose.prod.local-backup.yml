# Optional local-retention backup. It is not a substitute for an independently
# monitored off-host backup. Enable explicitly with --profile local-backup.
services:
  backup-local:
    profiles: ["local-backup"]
    image: ${ANTCODE_POSTGRES_IMAGE_REPOSITORY:?PostgreSQL image repository is required}@sha256:${ANTCODE_POSTGRES_IMAGE_DIGEST:?PostgreSQL image digest is required}
    restart: unless-stopped
    read_only: true
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    tmpfs:
      - /tmp
    environment:
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_TIMEOUT_SECONDS: ${BACKUP_TIMEOUT_SECONDS:-3600}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
    secrets:
      - database_url
    volumes:
      - backup_data:/backup
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        partial=""
        checksum_partial=""
        cleanup() {
          rm -f "$${partial:-/backup/.no-partial}" "$${checksum_partial:-/backup/.no-checksum-partial}"
        }
        trap cleanup EXIT INT TERM HUP
        find /backup -type f -name '*.partial' -delete
        database_url="$$(cat /run/secrets/database_url)"
        while true; do
          target="/backup/antcode-$$(date -u +%Y%m%dT%H%M%SZ).dump"
          partial="$$target.partial"
          checksum_partial="$$target.sha256.partial"
          timeout "$${BACKUP_TIMEOUT_SECONDS}" pg_dump \
            --dbname="$$database_url" --format=custom --file="$$partial"
          timeout "$${BACKUP_TIMEOUT_SECONDS}" pg_restore --list "$$partial" >/dev/null
          checksum="$$(sha256sum "$$partial" | awk '{print $$1}')"
          mv "$$partial" "$$target"
          printf '%s  %s\n' "$$checksum" "$$(basename "$$target")" > "$$checksum_partial"
          mv "$$checksum_partial" "$$target.sha256"
          date -u +%s > /backup/.last-success.partial
          mv /backup/.last-success.partial /backup/.last-success
          find /backup -type f \( -name 'antcode-*.dump' -o -name 'antcode-*.dump.sha256' \) \
            -mtime "+$${BACKUP_RETENTION_DAYS}" -delete
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) local backup completed: $$target"
          sleep 86400
        done
    # 这里的"重启"是重试机制：备份循环卡住/落后时重启容器会立刻重跑一次 pg_dump。
    # 以前 kill 内联在 test 里，第一次探测（t=5m）就杀，start_period 的 2 小时和
    # retries: 3 都是死配置——任何 pg_dump 超过 5 分钟的库都永远备份不完，
    # 每 5 分钟被 SIGTERM 打断一次。现在两者都真正生效。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 3 ${BACKUP_HEALTH_START_PERIOD_SECONDS:-7200}
          'test -s /backup/.last-success && last="$$(cat /backup/.last-success)"
          && now="$$(date -u +%s)" && test "$$((now - last))" -le "$${BACKUP_MAX_AGE_SECONDS}"'
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: ${BACKUP_HEALTH_START_PERIOD_SECONDS:-7200}s

volumes:
  backup_data:
