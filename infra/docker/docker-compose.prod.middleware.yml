x-antcode-logging: &antcode-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

x-backend-environment: &backend-environment
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
  ENCRYPTION_KEY_SALT_FILE: /run/secrets/encryption_key_salt
  ENCRYPTION_KEYS_LEGACY_FILE: /run/secrets/encryption_keys_legacy
  ENCRYPTION_LEGACY_KDF_SALT: ${ENCRYPTION_LEGACY_KDF_SALT:-}
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:?REDIS_NAMESPACE is required}
  REDIS_ACL_ENABLED: "true"
  AUTH_COOKIE_SECURE: "true"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: ${ANTCODE_POSTGRES_IMAGE_REPOSITORY:?PostgreSQL image repository is required}@sha256:${ANTCODE_POSTGRES_IMAGE_DIGEST:?PostgreSQL image digest is required}
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *antcode-logging
    cpus: 4
    mem_limit: 8g
    pids_limit: 2048
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-antcode}
    secrets:
      - postgres_password
    # healthcheck 包装器把连续失败计数与 grace 起点写在 /tmp。postgres 的根文件系统
    # 不是只读的，`docker restart` **不会**清空它，所以必须显式挂 tmpfs，否则重启后
    # 会读到上一代的计数与起点，第一次失败就直接重启——正是要修掉的那个行为。
    tmpfs:
      - /tmp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
    # 崩溃恢复期间 pg_isready 会持续拒连。以前第一次失败就 kill PID 1，恢复从头再来，
    # 恢复耗时超过一个 interval 的库因此永远起不来；retries: 5 现在真的给出 5 次余量。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 5 30
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: ${ANTCODE_REDIS_IMAGE_REPOSITORY:?Redis image repository is required}@sha256:${ANTCODE_REDIS_IMAGE_DIGEST:?Redis image digest is required}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    cpus: 2
    mem_limit: 4g
    pids_limit: 512
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${ANTCODE_REDIS_MAXMEMORY:-3gb}
      - --maxmemory-policy
      - noeviction
      - --aclfile
      - /usr/local/etc/redis/users.acl
    environment:
      REDIS_HEALTHCHECK_USER: ${REDIS_HEALTHCHECK_USER:?Redis healthcheck user is required}
    secrets:
      - redis_healthcheck_password
    # 同 postgres：包装器状态落在 /tmp，根文件系统可写且 restart 不清空，必须挂 tmpfs。
    tmpfs:
      - /tmp
    volumes:
      - redis_data:/data
      - ${ANTCODE_REDIS_ACL_DIR:?writable Redis ACL directory is required}:/usr/local/etc/redis
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
    # AOF 载入期间 redis 同样会拒绝服务，与 postgres 崩溃恢复是同一类暂态。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 5 30
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_healthcheck_password)"
          redis-cli --user "$${REDIS_HEALTHCHECK_USER}" -t 3 ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # migration 与 crawl-redis-upgrade 跑的就是 Web API 镜像，只是入口命令不同，因此
  # 这里**只引用**同一个 tag，不重复声明 build——同名 tag 的构建定义只保留一处（在
  # docker-compose.prod.control.yml 的 web-api 上），避免同一个 tag 被构建三次。
  # 两个后果必须记住：
  #   1) 调用方必须先 build web-api 再 run 它们（deploy-production.sh /
  #      bootstrap-admin.sh 已固定这个顺序）；
  #   2) `compose pull` 不能对它们执行，也不能靠 `--ignore-buildable` 兜底——那个开关
  #      只跳过自身有 build 段的服务，这两个会被拿去 registry 解析并失败。部署入口
  #      因此点名只拉第三方运行时镜像。
  migration:
    image: antcode-web-api:${ANTCODE_IMAGE_TAG:?unique application image tag is required}
    restart: "no"
    logging: *antcode-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 2
    mem_limit: 2g
    pids_limit: 1024
    tmpfs:
      - /tmp
    environment:
      <<: *backend-environment
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
    secrets:
      - database_url
      - redis_url
      - encryption_key
      - encryption_key_salt
      - encryption_keys_legacy
      - jwt_secret
    command: ["python", "-m", "scripts.init_db"]
    networks:
      - antcode-control
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  crawl-redis-upgrade:
    image: antcode-web-api:${ANTCODE_IMAGE_TAG:?unique application image tag is required}
    profiles: ["crawl-redis-upgrade"]
    restart: "no"
    logging: *antcode-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /tmp
    environment:
      REDIS_URL_FILE: /run/secrets/redis_url
      REDIS_NAMESPACE: ${REDIS_NAMESPACE:?REDIS_NAMESPACE is required}
    secrets:
      - redis_url
    command: ["python", "-m", "scripts.migrate_crawl_redis"]
    networks:
      - antcode-control
    depends_on:
      redis:
        condition: service_healthy
