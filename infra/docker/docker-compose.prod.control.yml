x-antcode-logging: &antcode-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

x-backend-environment: &backend-environment
  DATABASE_URL_FILE: /run/secrets/database_url
  REDIS_URL_FILE: /run/secrets/redis_url
  ENCRYPTION_KEY_FILE: /run/secrets/encryption_key
  ENCRYPTION_KEY_SALT_FILE: /run/secrets/encryption_key_salt
  ENCRYPTION_KEYS_LEGACY_FILE: /run/secrets/encryption_keys_legacy
  ENCRYPTION_LEGACY_KDF_SALT: ${ENCRYPTION_LEGACY_KDF_SALT:-}
  ENCRYPTION_ALLOW_LEGACY_SHA256: ${ENCRYPTION_ALLOW_LEGACY_SHA256:-false}
  REDIS_NAMESPACE: ${REDIS_NAMESPACE:?REDIS_NAMESPACE is required}
  REDIS_ACL_ENABLED: "true"
  AUTH_COOKIE_SECURE: "true"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# 五个应用镜像由本仓 Compose 就地构建，没有 registry 产物，也没有签名与不可变
# digest：回滚只能 revert 源码后重新构建。ANTCODE_IMAGE_TAG 必须是
# 每次发布唯一的标签，用它把"运行中的容器"对回一次确定的源码构建；复用同一个标签
# 会让 `up -d` 认为镜像没变而不重建容器。第三方运行时镜像（postgres / redis /
# 反向代理）仍按 digest pin，那部分不可变性没有丢。
x-backend-service: &backend-service
  restart: unless-stopped
  logging: *antcode-logging
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # /tmp 还承载 healthcheck 包装器的连续失败计数与 grace 起点：它必须是 tmpfs，
  # 每次容器启动都是空的，计数与宽限期才会按"本次容器生命周期"重新起算。
  tmpfs:
    - /tmp
  networks:
    - antcode-control
  depends_on:
    migration:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  web-api:
    <<: *backend-service
    image: antcode-web-api:${ANTCODE_IMAGE_TAG:?unique application image tag is required}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web_api
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    expose:
      - "8000"
    environment:
      <<: *backend-environment
      BIND_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      SERVER_RELOAD: "false"
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      API_BASE_URL: ${ANTCODE_PUBLIC_API_BASE_URL:?public HTTPS API base URL is required}
      GATEWAY_HOST: ${ANTCODE_GATEWAY_HOST:?public mTLS Gateway host is required}
      GATEWAY_PORT: ${ANTCODE_GATEWAY_PUBLIC_PORT:?public mTLS Gateway port is required}
      WORKER_INSTALL_CONFIG_REQUIRED: "true"
      WORKER_INSTALL_SOURCE_URL: ${ANTCODE_WORKER_INSTALL_SOURCE_URL:?Worker install HTTPS Git source is required}
      WORKER_INSTALL_SOURCE_REF: ${ANTCODE_WORKER_INSTALL_SOURCE_REF:?Worker install 40-character Git commit is required}
      WORKER_INSTALL_GATEWAY_TLS: "true"
      WORKER_INSTALL_UV_VERSION: ${ANTCODE_WORKER_INSTALL_UV_VERSION:?pinned Worker install uv version is required}
      ANTCODE_TRUSTED_PROXIES: ${ANTCODE_FRONTEND_CONTROL_IP:?exact frontend control-network IP is required}
    secrets:
      - database_url
      - redis_url
      - encryption_key
      - encryption_key_salt
      - encryption_keys_legacy
      - jwt_secret
    volumes:
      - web_data:/app/data
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
      - antcode-service-egress
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 3 30
          'curl -fsS --max-time 4 http://127.0.0.1:8000/api/v1/health/live >/dev/null'
          && curl -fsS --max-time 4 http://127.0.0.1:8000/api/v1/health/ready >/dev/null
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  master:
    <<: *backend-service
    image: antcode-master:${ANTCODE_IMAGE_TAG:?unique application image tag is required}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.master
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    environment:
      <<: *backend-environment
    secrets:
      - database_url
      - redis_url
      - encryption_key
      - encryption_key_salt
      - encryption_keys_legacy
    volumes:
      - master_data:/app/data
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
      - antcode-service-egress
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 3 30
          'curl -fsS --max-time 4 http://127.0.0.1:8101/health/live >/dev/null'
          && curl -fsS --max-time 4 http://127.0.0.1:8101/health/ready >/dev/null
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  gateway:
    <<: *backend-service
    image: antcode-gateway:${ANTCODE_IMAGE_TAG:?unique application image tag is required}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    stop_grace_period: 30s
    cpus: 2
    mem_limit: 2g
    pids_limit: 2048
    ports:
      - "${ANTCODE_GATEWAY_BIND_ADDRESS:?Gateway bind address is required}:${ANTCODE_GATEWAY_PUBLIC_PORT:-50051}:50051"
    expose:
      - "8100"
    environment:
      <<: *backend-environment
      GRPC_HOST: "0.0.0.0"
      GRPC_PORT: "50051"
      GRPC_TLS_CERT_PATH: /etc/antcode/tls/server.crt
      GRPC_TLS_KEY_PATH: /etc/antcode/tls/server.key
      GRPC_TLS_CA_PATH: /etc/antcode/tls/ca.crt
      ANTCODE_GATEWAY_ALLOW_INSECURE: "false"
    secrets:
      - database_url
      - redis_url
      - encryption_key
      - encryption_key_salt
      - encryption_keys_legacy
    volumes:
      - ${ANTCODE_GATEWAY_TLS_DIR:?Gateway mTLS directory is required}:/etc/antcode/tls:ro
      - gateway_data:/app/data
      - ./healthcheck.sh:/usr/local/bin/antcode-healthcheck:ro
    networks:
      - antcode-control
      - antcode-execution
    # Gateway 没有独立的 live 端点，但 /health/ready 的响应体按组件分列
    # （server.py::_readiness_response）：`"grpc":"ok"` 就是"gRPC server 还在 listen"，
    # 也就是这个进程唯一"重启才能修"的故障面。Redis / DB 不可达只让整体转 503，
    # 那是依赖暂态——重启 Gateway 修不好它，只会把所有 Worker 一起踢下线。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /usr/local/bin/antcode-healthcheck 3 30
          "curl -s --max-time 4 http://127.0.0.1:8100/health/ready | grep -q '\"grpc\":\"ok\"'"
          && curl -fsS --max-time 4 http://127.0.0.1:8100/health/ready >/dev/null
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
