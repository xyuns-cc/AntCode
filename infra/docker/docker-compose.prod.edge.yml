x-antcode-logging: &antcode-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "10"

services:
  frontend:
    image: ${ANTCODE_FRONTEND_IMAGE_REPOSITORY:?frontend image repository is required}@sha256:${ANTCODE_FRONTEND_IMAGE_DIGEST:?frontend image digest is required}
    restart: unless-stopped
    logging: *antcode-logging
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    # tmpfs 必须显式带 uid/gid：Docker 建 tmpfs 时按 root:root 0775 挂载，而镜像以
    # nginx(101) 运行。少了这几行，入口脚本的 envsubst 写不出
    # /etc/nginx/conf.d/default.conf（"exists, but not writable"），nginx 起来却没有
    # 任何 server 块，8080 healthcheck 恒失败并 `kill -TERM 1`，前端无限重启，
    # 依赖它 healthy 的 reverse-proxy 永远起不来（真机实测）。/tmp 不带 uid 是因为
    # 镜像里它本就是 1777，nginx 的 pid 文件落在那里。
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0700
    expose:
      - "8080"
    environment:
      WEB_API_UPSTREAM: web-api:8000
    networks:
      - antcode-control
      - antcode-edge
    depends_on:
      web-api:
        condition: service_healthy
    # 两段式探针。第一段是本地存活（静态首页），失败说明 nginx 自身坏了——
    # 例如 tmpfs 权限导致 envsubst 写不出 conf.d，nginx 起来却没有任何 server 块；
    # 这种状态 restart 能修，所以 `kill -TERM 1`。
    # 第二段穿透自己的 /api 代理打到 Web API，反映真实上游可达性。它**不**杀进程：
    # 上游故障时重启 frontend 只会把"API 不可用"升级成"整站连不上"。返回非 0 让
    # 容器进入 unhealthy，`up -d --wait` 因此不会在 /api 全挂时宣告部署成功。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null http://127.0.0.1:8080/ || { kill -TERM 1; exit 1; };
          wget -q -T 3 -O /dev/null http://127.0.0.1:8080/api/v1/health
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s

  reverse-proxy:
    image: ${ANTCODE_REVERSE_PROXY_IMAGE_REPOSITORY:?reverse proxy image repository is required}@sha256:${ANTCODE_REVERSE_PROXY_IMAGE_DIGEST:?reverse proxy image digest is required}
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *antcode-logging
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 512m
    pids_limit: 256
    # 同上：以 101:101 只读运行，proxy/client 临时目录与 pid 目录必须归 nginx 所有。
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=101,gid=101,mode=0700
      - /var/run:uid=101,gid=101,mode=0700
    ports:
      - "0.0.0.0:${HTTPS_PORT:-443}:8443"
      - "0.0.0.0:${HTTP_REDIRECT_PORT:-80}:8080"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${ANTCODE_TLS_CERTS_DIR:?reverse proxy TLS directory is required}:/etc/nginx/certs:ro
    networks:
      - antcode-edge
    depends_on:
      frontend:
        condition: service_healthy
    # 同 frontend：本地存活失败才重启，链路探针只影响 healthy 判定。
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -T 3 -O /dev/null http://127.0.0.1:8081/healthz || { kill -TERM 1; exit 1; };
          wget -q -T 3 -O /dev/null http://127.0.0.1:8081/healthz/upstream
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 20s
