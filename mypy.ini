; mypy 渐进配置：`make type-check`（也就是 `make check` / `make release-gate`）里跑
;   uv run mypy packages services --ignore-missing-imports
; 没有这个文件 mypy 会拿默认配置扫全量,存量代码几乎必挂。
; 该文件把默认基线放到"能通过"的档位,后续按目录逐个开严(与 ruff 逐目录
; 收紧同步节奏,见 pyproject.toml [tool.ruff.lint.per-file-ignores] 注释)。
;
; 严格度阶梯（越靠上越松）:
;   1. ignore_missing_imports = True     ; 第三方无 stub 的库不报错
;   2. follow_imports = silent           ; 跨模块导入不递归深挖
;   3. disallow_untyped_defs = False     ; 允许无注解函数
;   4. check_untyped_defs = True         ; 检查尚未补全注解的函数体
;   5. warn_return_any = False           ; 不追 Any 传染

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
; P3 收紧：把 follow_imports 从 silent 改为 normal —— silent 会静默忽略
; 跨模块类型错误，等于给 stub 缺失开了全局豁免。normal 让 mypy 递归但只
; 汇报本目录里的问题（外部包由 ignore_missing_imports 承担）。
follow_imports = normal
; warn_unused_ignores 暂不启用 —— 存量代码里有 12 处 follow_imports=silent
; 时代残留的多余 type: ignore，属未来清理项。开启后 `make type-check` 立刻挂。

; ============================================================
; 渐进白名单：目前所有目录都豁免,后续按目录逐个开
; ============================================================

; contracts 大量是 protobuf 生成的 _pb2 / _pb2_grpc,mypy 对生成代码几乎必挂
[mypy-packages.antcode_contracts.*]
ignore_errors = True

; 测试目录：断言/mock 用 Any 是常态,不进 type-check
[mypy-*.tests.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True

