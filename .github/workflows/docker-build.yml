name: Build, Gate and Sign Docker Images

on:
  workflow_call:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/antcode

jobs:
  gitleaks:
    name: Gitleaks (release history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/v')
        run: '[[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - name: Verify release tag belongs to main history
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/main"
      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  hadolint:
    name: Hadolint (${{ matrix.dockerfile }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/docker/Dockerfile.web_api
          - infra/docker/Dockerfile.master
          - infra/docker/Dockerfile.gateway
          - infra/docker/Dockerfile.worker
          - web/antcode-frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          ignore: DL3008,DL3013,DL3018
          failure-threshold: error

  trivy-fs:
    name: Trivy (release filesystem)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Scan release filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          scan-ref: .
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

  publish:
    name: Build unsigned candidate (${{ matrix.service }})
    needs: [gitleaks, hadolint, trivy-fs]
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-api
            context: .
            dockerfile: infra/docker/Dockerfile.web_api
          - service: master
            context: .
            dockerfile: infra/docker/Dockerfile.master
          - service: gateway
            context: .
            dockerfile: infra/docker/Dockerfile.gateway
          - service: worker
            context: .
            dockerfile: infra/docker/Dockerfile.worker
          - service: frontend
            context: web/antcode-frontend
            dockerfile: web/antcode-frontend/Dockerfile
    uses: ./.github/workflows/docker-build-candidate.yml
    with:
      service: ${{ matrix.service }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
    secrets: inherit

  release-e2e:
    name: Production release digest E2E
    needs: [publish]
    permissions:
      actions: read
      contents: read
      packages: read
    uses: ./.github/workflows/docker-release-e2e.yml
    secrets: inherit

  sign-services:
    name: Sign gated digest (${{ matrix.service }})
    needs: [release-e2e]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [web-api, master, gateway, worker, frontend]
    steps:
      - name: Download gated digest descriptor
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-digest-${{ matrix.service }}
          path: release-digests
      - name: Read gated platform digests
        id: digests
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          descriptor="release-digests/${SERVICE}.platforms.json"
          index_file="release-digests/${SERVICE}.digest"
          test "$(find release-digests -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 2
          jq -e '.schema_version == 1 and (keys == ["amd64", "arm64", "index", "schema_version"])' \
            "$descriptor" >/dev/null
          for name in index amd64 arm64; do
            digest="$(jq -er --arg name "$name" '.[$name]' "$descriptor")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s=%s\n' "$name" "$digest" >> "$GITHUB_OUTPUT"
          done
          index_digest="$(cat "$index_file")"
          [[ "$index_digest" == "$(jq -er '.index' "$descriptor")" ]]
          [[ "$(jq -er '.amd64' "$descriptor")" != "$(jq -er '.arm64' "$descriptor")" ]]
      - name: Attest service index provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.digests.outputs.index }}
          push-to-registry: true
      - name: Attest amd64 child provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          push-to-registry: true
      - name: Attest arm64 child provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Sign service index and platform digests
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          INDEX_DIGEST: ${{ steps.digests.outputs.index }}
        run: |
          set -euo pipefail
          for digest in "$INDEX_DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            cosign sign --yes "${IMAGE}@${digest}"
          done
      - name: Verify service signatures and provenance attestations
        env:
          AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-build.yml@${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          INDEX_DIGEST: ${{ steps.digests.outputs.index }}
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/docker-build.yml
        run: |
          set -euo pipefail
          for digest in "$INDEX_DIGEST" "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            ref="${IMAGE}@${digest}"
            cosign verify --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ref" >/dev/null
            gh attestation verify "oci://${ref}" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$SIGNER_WORKFLOW" >/dev/null
          done

  finalize-release:
    name: Publish atomic release collection
    needs: [sign-services]
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/docker-finalize-release.yml
    secrets: inherit
