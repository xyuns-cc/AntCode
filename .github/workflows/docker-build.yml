name: Build, Scan and Sign Docker Images

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/antcode

jobs:
  verify-ci:
    name: Verify source CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful CI for manual publication
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });
            if (runs.data.total_count === 0) {
              core.setFailed(`No successful CI run found for ${context.sha}`);
            }

  publish:
    name: Publish ${{ matrix.service }}
    needs: verify-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-api
            context: .
            dockerfile: infra/docker/Dockerfile.web_api
          - service: master
            context: .
            dockerfile: infra/docker/Dockerfile.master
          - service: gateway
            context: .
            dockerfile: infra/docker/Dockerfile.gateway
          - service: worker
            context: .
            dockerfile: infra/docker/Dockerfile.worker
          - service: frontend
            context: web/antcode-frontend
            dockerfile: web/antcode-frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build scan candidate
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/amd64
          tags: local/antcode-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/antcode-${{ matrix.service }}:${{ github.sha }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max

      - name: Scan published digest
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
