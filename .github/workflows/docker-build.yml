name: Build, Scan and Sign Docker Images

on:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/antcode

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web-api
            context: .
            dockerfile: infra/docker/Dockerfile.web_api
          - service: master
            context: .
            dockerfile: infra/docker/Dockerfile.master
          - service: gateway
            context: .
            dockerfile: infra/docker/Dockerfile.gateway
          - service: worker
            context: .
            dockerfile: infra/docker/Dockerfile.worker
          - service: frontend
            context: web/antcode-frontend
            dockerfile: web/antcode-frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify release tag belongs to main history
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/main"

      - name: Set up QEMU
        # arm64 扫描候选镜像需要在 amd64 runner 上交叉构建
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=semver,pattern={{version}}

      # 扫描门禁语义：先构建（不 push）将要发布的全部架构，逐架构 trivy 扫描
      # 通过之后才允许 push manifest —— 保证有 CRITICAL/HIGH 漏洞的标签从不
      # 可拉取。（此前只在 push 前扫 amd64，arm64 要等 manifest 已发布后补扫，
      # 存在带病标签可拉取的时间窗。）
      - name: Build scan candidate (amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/amd64
          tags: local/antcode-${{ matrix.service }}:${{ github.sha }}-amd64
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Build scan candidate (arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          platforms: linux/arm64
          tags: local/antcode-${{ matrix.service }}:${{ github.sha }}-arm64
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64

      - name: Scan candidate image (amd64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/antcode-${{ matrix.service }}:${{ github.sha }}-amd64
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

      - name: Scan candidate image (arm64)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/antcode-${{ matrix.service }}:${{ github.sha }}-arm64
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

      # P1-CI-06: 发布顺序重排为 构建 -> 按 digest 扫描 -> 通过后才打正式标签。
      # 本步复用两个候选构建的 gha cache 组装 manifest，但只以 push-by-digest
      # 推送（仓库内仅 digest 可寻址，没有任何 tag）；正式标签在下方 digest
      # 扫描通过后由 imagetools 指向同一 digest 创建。此前顺序是先推正式标签
      # 再扫 digest，存在带病标签可拉取的时间窗，且扫描对象与发布对象可能因
      # 缓存偏差不一致。
      - name: Build and push by digest (untagged)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ matrix.service }}
            type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max

      # 对将要发布的确切产物（registry 里的 digest）扫描；此时还没有任何
      # 正式标签指向它。逐架构的放行门禁是上面 push 前的候选扫描，本步
      # 额外保证「被打标签的 digest」与「被扫描的 digest」是同一个对象。
      - name: Scan pushed digest before tagging
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}@${{ steps.push.outputs.digest }}
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table

      # 扫描通过后才创建正式标签：纯 manifest 指向操作，不重新构建，
      # 保证标签指向的就是刚被扫描过的 digest。
      - name: Tag verified digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
