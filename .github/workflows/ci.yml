name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "22"

jobs:
  # ==================== 后端测试 ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unit/ -v --tb=short \
            --cov=packages --cov=services \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Run boundary tests
        run: uv run pytest tests/boundary/ -v --tb=short

      - name: Coverage gate (30% minimum)
        run: uv run python -c "
          import xml.etree.ElementTree as ET;
          tree = ET.parse('coverage.xml');
          rate = float(tree.getroot().attrib['line-rate']) * 100;
          print(f'Coverage: {rate:.1f}%');
          assert rate >= 30, f'Coverage {rate:.1f}% below 30% threshold'
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==================== 后端代码检查 ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ==================== 后端安全扫描 ====================
  backend-security:
    name: Backend Security & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run bandit security scan
        run: uv run bandit -r packages/ services/ -f json -o bandit-report.json || true

      - name: Block on HIGH severity bandit findings
        run: python scripts/fail_on_high_vulns.py bandit-report.json --tool bandit

      - name: Run pip-audit (deps CVE scan)
        run: |
          uv pip install pip-audit
          uv run pip-audit --format=json --output=pip-audit-report.json || true

      - name: Block on HIGH/CRITICAL pip-audit findings
        run: python scripts/fail_on_high_vulns.py pip-audit-report.json --tool pip-audit

      - name: Run mypy type check
        # J1: 去掉 || true 让 mypy 真正阻断 PR；type-check 存量白名单靠 mypy.ini
        # 里逐目录 ignore_errors=True 收敛，与 ruff 逐目录收紧同步节奏。
        run: uv run mypy packages services --ignore-missing-imports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ==================== 前端测试 ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Run type check
        working-directory: web/antcode-frontend
        run: npm run type-check

      - name: Run lint
        working-directory: web/antcode-frontend
        run: npm run lint

      - name: Run tests
        working-directory: web/antcode-frontend
        run: npm run test -- --run

  # ==================== 前端安全扫描 ====================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: npm audit (HIGH severity blocks)
        working-directory: web/antcode-frontend
        run: npm audit --audit-level=high

  # ==================== 前端构建 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Build
        working-directory: web/antcode-frontend
        run: npm run build

  # ==================== 集成测试 ====================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: antcode_test
          POSTGRES_USER: antcode
          POSTGRES_PASSWORD: test_antcode_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U antcode -d antcode_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://antcode:test_antcode_pw@127.0.0.1:5432/antcode_test
          REDIS_URL: redis://127.0.0.1:6379/0
        run: uv run pytest tests/integration/ -v --tb=short

  # ==================== 摘要 ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-test, backend-lint, backend-security, frontend-test, frontend-security, frontend-build, integration-test]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端测试 | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端代码检查 | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端安全扫描 | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端测试 | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端安全扫描 | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端构建 | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 集成测试 | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
