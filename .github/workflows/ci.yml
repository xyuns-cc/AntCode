name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "22"

jobs:

  # ==================== 后端代码检查 ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        # ruff 在 [project.optional-dependencies].dev,不加 --dev 就装不上 → ruff step 会挂
        run: uv sync --all-packages --dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ==================== 后端测试 ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --extra dev

      - name: Run core unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/test_*.py tests/unit/core -q

      - name: Run Web API unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/web_api -q

      - name: Run Gateway and Master unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/gateway tests/unit/master -q

      - name: Run Worker and script unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/worker tests/unit/scripts -q

      - name: Run boundary tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/boundary -q

      - name: Run contract tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/contracts -q

  # ==================== 后端安全扫描 ====================
  backend-security:
    name: Backend Security & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run bandit security scan
        run: |
          rm -f bandit-report.json
          uv run bandit -r packages/ services/ \
            --severity-level high --confidence-level high \
            --exit-zero -f json -o bandit-report.json
          test -s bandit-report.json

      - name: Block on HIGH severity bandit findings
        run: python scripts/fail_on_high_vulns.py bandit-report.json --tool bandit

      - name: Run pip-audit (deps CVE scan)
        run: |
          rm -f pip-audit-report.json
          set +e
          uv run pip-audit --strict --format=json --output=pip-audit-report.json
          scan_status=$?
          set -e
          test -s pip-audit-report.json
          if [ "$scan_status" -gt 1 ]; then
            exit "$scan_status"
          fi

      - name: Block on HIGH/CRITICAL pip-audit findings
        run: python scripts/fail_on_high_vulns.py pip-audit-report.json --tool pip-audit

      - name: Run mypy type check
        # J1: 去掉 || true 让 mypy 真正阻断 PR；type-check 存量白名单靠 mypy.ini
        # 里逐目录 ignore_errors=True 收敛，与 ruff 逐目录收紧同步节奏。
        run: uv run mypy packages services --ignore-missing-imports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: error

  # ==================== 前端测试 ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Run type check
        working-directory: web/antcode-frontend
        run: npm run type-check

      - name: Run lint
        working-directory: web/antcode-frontend
        run: npm run lint:ci
      # 前端没有 test script（package.json 只暴露 lint/type-check/build）

  # ==================== 前端安全扫描 ====================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: npm audit (HIGH severity blocks)
        working-directory: web/antcode-frontend
        run: npm audit --audit-level=high

  # ==================== 前端构建 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Build
        working-directory: web/antcode-frontend
        run: npm run build

  # ==================== 摘要 ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, backend-security, frontend-test, frontend-security, frontend-build]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端代码检查 | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端测试 | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端安全扫描 | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 lint/type-check | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端安全扫描 | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端构建 | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
