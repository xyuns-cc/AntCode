name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "22"

jobs:
  # 说明：v1.0.0 起 tests/ 目录不进仓库（.gitignore 屏蔽），所以 CI 里没有
  # backend-test / integration-test 两个 job。回归测试在本地 / 内部 CI 环境跑。
  # 公共 CI 只做静态检查（lint / type-check / security）+ 构建可行性。

  # ==================== 后端代码检查 ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ==================== 后端安全扫描 ====================
  backend-security:
    name: Backend Security & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Run bandit security scan
        run: uv run bandit -r packages/ services/ -f json -o bandit-report.json || true

      - name: Block on HIGH severity bandit findings
        run: python scripts/fail_on_high_vulns.py bandit-report.json --tool bandit

      - name: Run pip-audit (deps CVE scan)
        run: |
          uv pip install pip-audit
          uv run pip-audit --format=json --output=pip-audit-report.json || true

      - name: Block on HIGH/CRITICAL pip-audit findings
        run: python scripts/fail_on_high_vulns.py pip-audit-report.json --tool pip-audit

      - name: Run mypy type check
        # J1: 去掉 || true 让 mypy 真正阻断 PR；type-check 存量白名单靠 mypy.ini
        # 里逐目录 ignore_errors=True 收敛，与 ruff 逐目录收紧同步节奏。
        run: uv run mypy packages services --ignore-missing-imports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # ==================== 前端测试 ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Run type check
        working-directory: web/antcode-frontend
        run: npm run type-check

      - name: Run lint
        working-directory: web/antcode-frontend
        run: npm run lint
      # 前端没有 test script（package.json 只暴露 lint/type-check/build）

  # ==================== 前端安全扫描 ====================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: npm audit (HIGH severity blocks)
        working-directory: web/antcode-frontend
        run: npm audit --audit-level=high

  # ==================== 前端构建 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Build
        working-directory: web/antcode-frontend
        run: npm run build

  # ==================== 摘要 ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, frontend-test, frontend-security, frontend-build]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端代码检查 | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端安全扫描 | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 lint/type-check | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端安全扫描 | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端构建 | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
