name: CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: "22.22.0"
  UV_VERSION: "0.8.17"

jobs:

  # ==================== 后端代码检查 ====================
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        # ruff 位于 [project.optional-dependencies].dev，必须安装 dev extra。
        # --frozen：严格按 uv.lock 安装，禁止 CI 里隐式改写解析结果。
        run: uv sync --all-packages --extra dev --frozen

      - name: Verify generated protocol artifacts
        run: |
          uv run python scripts/generate_proto.py
          git diff --exit-code -- contracts/proto packages/antcode_contracts/src/antcode_contracts

      - name: Run ruff check
        run: uv run ruff check .

      - name: Enforce complexity baseline
        run: make complexity

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ==================== 后端测试 ====================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://antcode:${{ github.run_id }}@localhost:15432/antcode_e2e_test
      PGPASSWORD: ${{ github.run_id }}
      REDIS_URL: redis://localhost:16379/14
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: antcode_migration_test
          POSTGRES_USER: antcode
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U antcode -d antcode_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --frozen

      - name: Generate backend test secrets
        run: |
          jwt_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 16)"
          for secret in "$jwt_secret" "$encryption_key" "$encryption_salt"; do
            echo "::add-mask::$secret"
          done
          {
            echo "JWT_SECRET=$jwt_secret"
            echo "ENCRYPTION_KEY=$encryption_key"
            echo "ENCRYPTION_KEY_SALT=$encryption_salt"
          } >> "$GITHUB_ENV"

      - name: Prepare integration databases
        run: |
          psql --host=localhost --port=15432 --username=antcode \
            --dbname=antcode_migration_test --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE antcode_e2e_test"
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 \
            uv run --extra dev python -c \
            'import asyncio; from scripts.init_db import _generate_schemas; asyncio.run(_generate_schemas())'

      - name: Run core unit tests
        run: >-
          /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest
          tests/unit/test_*.py tests/unit/core -q --junitxml=backend-core-results.xml

      - name: Annotate backend core test failures
        if: failure() && hashFiles('backend-core-results.xml') != ''
        run: |
          uv run --extra dev python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("backend-core-results.xml").getroot()
          for case in root.iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is None:
                  continue
              message = (failure.text or failure.get("message") or "pytest failure").replace("%", "%25")
              message = message.replace("\r", "%0D").replace("\n", "%0A")
              title = f"Backend core test failed: {case.get('name', 'unknown')}"
              print(f"::error title={title}::{message}")
          PY

      - name: Run Web API unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/web_api -q

      - name: Run Gateway and Master unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/gateway tests/unit/master -q

      - name: Run Worker, script, and Scrapy unit tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/unit/worker tests/unit/scripts tests/unit/scrapy -q

      - name: Run boundary tests
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/boundary -q

      - name: Run contract tests
        env:
          ANTCODE_CONTRACT_REDIS_URL: redis://localhost:16379/14
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/contracts -q

      - name: Run integration tests
        env:
          ANTCODE_INTEGRATION_REDIS_URL: redis://localhost:16379/14
          DATABASE_URL: postgresql://antcode:${{ github.run_id }}@localhost:15432/antcode_e2e_test
          TEST_DATABASE_URL: postgresql://antcode:${{ github.run_id }}@localhost:15432/antcode_migration_test
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/integration -q

      - name: Run load-test self checks
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/loadtest -q

      - name: Collect E2E tests
        # 仅做导入/收集健全性快检；真实 E2E 门禁在下方 e2e job（compose 全栈真跑）。
        run: /usr/bin/perl -e 'alarm shift; exec @ARGV' 60 uv run --extra dev pytest tests/e2e --collect-only -q

  # ==================== 端到端测试（compose 全栈真实执行） ====================
  # 门禁语义：本 job 用 docker compose 构建与将要发布完全相同的 Dockerfile，
  # 启动完整栈（postgres/redis/web-api/master/gateway/worker/frontend），然后
  # 真实执行 pytest tests/e2e（不是 --collect-only）。summary 与 publish-images
  # 都依赖本 job：E2E 未真实通过时分支保护不放行、任何镜像都不允许发布。
  e2e:
    name: E2E (compose stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE_ARGS: --env-file .env -f infra/docker/docker-compose.dev.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --frozen

      - name: Allow unprivileged user namespaces for worker sandbox
        # Ubuntu 24.04 默认限制 unprivileged userns；worker 容器内 bwrap 沙箱需要。
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Generate ephemeral stack secrets
        # 一次性随机密钥仅存活于本 job；.env 同时用于 compose 变量替换与
        # env_file 注入（dev compose 的注入链会读项目根 .env）。
        run: |
          host_ip="$(hostname -I | awk '{print $1}')"
          pg_password="$(openssl rand -hex 16)"
          redis_password="$(openssl rand -hex 16)"
          jwt_secret="$(openssl rand -hex 32)"
          encryption_key="$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 16)"
          admin_password="$(openssl rand -base64 24 | tr -d '\n')Aa1!"
          worker_key="$(openssl rand -hex 32)"
          e2e_redis_url="redis://:${redis_password}@127.0.0.1:6379/0"
          for secret in "$pg_password" "$redis_password" "$jwt_secret" \
            "$encryption_key" "$encryption_salt" "$admin_password" "$worker_key" "$e2e_redis_url"; do
            echo "::add-mask::$secret"
          done
          {
            echo "HOST_IP=$host_ip"
            echo "E2E_POSTGRES_PASSWORD=$pg_password"
            echo "DEFAULT_ADMIN_PASSWORD=$admin_password"
            echo "ANTCODE_E2E_REDIS_URL=$e2e_redis_url"
            echo "ANTCODE_E2E_REDIS_NAMESPACE=antcode"
            # Compose 会在 build/run 阶段解析所有 service；控制面启动后，
            # Generate Direct Worker install key 步骤会用真实一次性 Key 覆盖此值。
            echo "ANTCODE_WORKER_KEY=$worker_key"
          } >> "$GITHUB_ENV"
          {
            echo "POSTGRES_DB=antcode_e2e_test"
            echo "POSTGRES_PASSWORD=$pg_password"
            echo "REDIS_PASSWORD=$redis_password"
            # dev compose 用 ${REDIS_NAMESPACE:?} 做 fail-closed 校验，缺它会让
            # `docker compose build` 直接失败。注意与上面的 ANTCODE_E2E_REDIS_NAMESPACE
            # 是两个变量：后者给 pytest 连 Redis 用，这个给容器内运行时用。
            echo "REDIS_NAMESPACE=antcode"
            echo "JWT_SECRET=$jwt_secret"
            echo "ENCRYPTION_KEY=$encryption_key"
            echo "ENCRYPTION_KEY_SALT=$encryption_salt"
            echo "DEFAULT_ADMIN_PASSWORD=$admin_password"
            # E2E 要求显式绑定专用 Worker（tests/e2e/conftest.py 的 fail-closed 校验）
            echo "WORKER_ID=worker-e2e-001"
            # CI 内 E2E git 源跑在 runner 私网地址上，控制面需要放行私网 git URL
            echo "ALLOW_PRIVATE_NODES=true"
            # P1-CI-04: generate-install-key 端点要求安装分发配置完整；
            # SOURCE_URL 只会拼进安装命令文本，冒烟不真正拉取该仓库。
            echo "WORKER_INSTALL_SOURCE_URL=https://github.com/antcode/antcode.git"
            echo "WORKER_INSTALL_SOURCE_REF=${GITHUB_SHA}"
            # load_worker_install_config 对该项是硬性要求（默认 False 会让端点恒 503）。
            # dev compose 只在 prod.control 里设过它，e2e 走 dev compose 必须显式补上，
            # 否则 "Generate Direct Worker install key" 步骤拿不到 Key、Worker 起不来。
            echo "WORKER_INSTALL_GATEWAY_TLS=true"
          } > .env

      - name: Build stack images
        run: docker compose $COMPOSE_ARGS build

      - name: Start database and cache
        run: docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 300 postgres redis

      - name: Initialize database schema
        # P1-CI-03: 全新 Postgres 必须先显式建表（infra/docker/README.md 的
        # scripts.init_db 步骤）；Web API lifespan 只建连接、不建表，直接
        # compose up 会让服务在空库上带病启动。
        run: docker compose $COMPOSE_ARGS run --rm --no-deps web-api python -m scripts.init_db

      - name: Start control plane stack
        run: docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 900 web-api master gateway frontend

      - name: Generate Direct Worker install key
        env:
          ANTCODE_E2E_WEB_API_URL: http://127.0.0.1:8000
        run: |
          uv run python - <<'PY'
          import asyncio
          import os
          from types import SimpleNamespace

          import httpx

          from tests.e2e.helpers import extract_data, login, request_json


          async def main() -> None:
              config = SimpleNamespace(
                  admin_user="admin",
                  admin_password=os.environ["DEFAULT_ADMIN_PASSWORD"],
              )
              base_url = os.environ["ANTCODE_E2E_WEB_API_URL"]
              async with httpx.AsyncClient(base_url=base_url, timeout=30.0) as client:
                  token = await login(client, config)
                  payload = await request_json(
                      client,
                      "POST",
                      "/workers/generate-install-key",
                      token=token,
                      json={"os_type": "linux"},
                  )
              install_key = (extract_data(payload) or {})["key"]
              print(f"::add-mask::{install_key}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
                  handle.write(f"ANTCODE_WORKER_KEY={install_key}\n")


          asyncio.run(main())
          PY

      - name: Start Direct Worker
        run: docker compose $COMPOSE_ARGS up -d --wait --wait-timeout 300 worker

      - name: Wait for worker readiness
        # worker 服务没有 compose healthcheck，就绪状态以容器内 /health/ready 为准
        # （其中隐含 Worker 已完成 direct 注册）。
        run: |
          timeout 300 bash -c \
            "until docker compose $COMPOSE_ARGS exec -T worker curl -fsS http://localhost:8001/health/ready >/dev/null 2>&1; do sleep 5; done"

      - name: Start E2E git HTTP server
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-git"
          nohup uv run python -m tests.e2e.git_http_server \
            --root "$RUNNER_TEMP/e2e-git" --host 0.0.0.0 --port 18081 \
            > "$RUNNER_TEMP/e2e-git-http.log" 2>&1 &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:18081/ >/dev/null; do sleep 1; done'

      - name: Run E2E tests
        env:
          ANTCODE_E2E_CONFIRM: FULL
          ANTCODE_E2E_ADMIN_USER: admin
          ANTCODE_E2E_ADMIN_PASSWORD: ${{ env.DEFAULT_ADMIN_PASSWORD }}
          ANTCODE_E2E_WORKER_ID: worker-e2e-001
          ANTCODE_E2E_WEB_API_URL: http://127.0.0.1:8000
          ANTCODE_E2E_EXPECT_TRANSPORT_MODE: direct
          ANTCODE_E2E_GIT_ROOT: ${{ runner.temp }}/e2e-git
          ANTCODE_E2E_GIT_BASE_URL: http://${{ env.HOST_IP }}:18081
        run: uv run --extra dev pytest tests/e2e -q

      # ---- P1-CI-04: Gateway backendless 生产链路最小冒烟 ----
      # 覆盖：安装 Key 注册（Web API）-> 凭据认证连 Gateway(gRPC) ->
      # 初始 lease 授予 -> 心跳经 Gateway 上报并在控制面标记 online。
      # 已知缺口：dev compose Gateway 是 h2c 明文（ANTCODE_GATEWAY_ALLOW_INSECURE=true），
      # TLS/mTLS 证书链路仍未被 CI 覆盖，需在远程验收环境验证。
      - name: Prepare gateway smoke credentials
        run: |
          uv run python - <<'PY'
          """管理员登录 -> 生成一次性安装 Key -> 记录当前在线 Worker 基线。"""
          import asyncio
          import json
          import os
          from types import SimpleNamespace

          import httpx

          from tests.e2e.helpers import extract_data, login, request_json


          async def main() -> None:
              base_url = os.environ.get("ANTCODE_E2E_WEB_API_URL", "http://127.0.0.1:8000")
              config = SimpleNamespace(
                  admin_user=os.environ.get("ANTCODE_E2E_ADMIN_USER", "admin"),
                  admin_password=os.environ["DEFAULT_ADMIN_PASSWORD"],
              )
              async with httpx.AsyncClient(base_url=base_url, timeout=30.0) as client:
                  token = await login(client, config)
                  payload = await request_json(
                      client,
                      "POST",
                      "/workers/generate-install-key",
                      token=token,
                      json={"os_type": "linux"},
                  )
                  install_key = (extract_data(payload) or {})["key"]
                  online = await request_json(
                      client,
                      "GET",
                      "/workers",
                      token=token,
                      params={"page": 1, "size": 100, "status": "online"},
                  )
                  baseline = sorted(
                      str(item.get("id"))
                      for item in ((extract_data(online) or {}).get("items") or [])
                  )
              tmp = os.environ["RUNNER_TEMP"]
              for name, content in (
                  ("gateway-smoke.key", install_key),
                  ("gateway-smoke.token", token),
                  ("gateway-smoke.baseline.json", json.dumps(baseline)),
              ):
                  fd = os.open(
                      os.path.join(tmp, name),
                      os.O_WRONLY | os.O_CREAT | os.O_TRUNC,
                      0o600,
                  )
                  with os.fdopen(fd, "w") as handle:
                      handle.write(content)


          asyncio.run(main())
          PY
        env:
          ANTCODE_E2E_WEB_API_URL: http://127.0.0.1:8000

      - name: Run gateway backendless worker smoke
        run: |
          install_key="$(cat "$RUNNER_TEMP/gateway-smoke.key")"
          # 复用 worker 服务定义与镜像，仅用环境变量切到 Gateway backendless：
          # 清空 DATABASE_URL/REDIS_URL/WORKER_REDIS_URL（backendless fail-closed 校验）
          # 与 WORKER_ID（身份改由安装 Key 注册的凭据提供），数据目录隔离避免
          # 与 direct Worker 共享凭据存储。
          docker compose $COMPOSE_ARGS run -d --no-deps \
            --name antcode-worker-gateway-smoke \
            -e WORKER_TRANSPORT_MODE=gateway \
            -e WORKER_GATEWAY_BACKENDLESS=true \
            -e WORKER_GATEWAY_HOST=gateway \
            -e WORKER_GATEWAY_PORT=50051 \
            -e WORKER_GATEWAY_TLS=false \
            -e DATABASE_URL= \
            -e REDIS_URL= \
            -e WORKER_REDIS_URL= \
            -e WORKER_ID= \
            -e WORKER_NAME=worker-e2e-gateway \
            -e WORKER_DATA_DIR=/app/data/gateway-smoke \
            -e ANTCODE_WORKER_KEY="$install_key" \
            worker
          # /health/ready 通过意味着安装 Key 注册、Gateway 认证与初始 lease
          # 全部成功（任一失败 worker 启动 fail-fast，永远不会 ready）。
          timeout 240 bash -c \
            'until docker exec antcode-worker-gateway-smoke curl -fsS http://localhost:8001/health/ready >/dev/null 2>&1; do sleep 5; done'

      - name: Verify gateway worker heartbeat on control plane
        run: |
          uv run python - <<'PY'
          """轮询控制面在线列表，要求出现基线之外的新 Worker（即 Gateway 冒烟实例）。"""
          import asyncio
          import json
          import os
          import time

          import httpx

          from tests.e2e.helpers import extract_data, request_json

          POLL_TIMEOUT_SECONDS = 180
          POLL_INTERVAL_SECONDS = 5


          async def main() -> None:
              base_url = os.environ.get("ANTCODE_E2E_WEB_API_URL", "http://127.0.0.1:8000")
              tmp = os.environ["RUNNER_TEMP"]
              with open(os.path.join(tmp, "gateway-smoke.token")) as handle:
                  token = handle.read().strip()
              with open(os.path.join(tmp, "gateway-smoke.baseline.json")) as handle:
                  baseline = set(json.load(handle))
              deadline = time.monotonic() + POLL_TIMEOUT_SECONDS
              async with httpx.AsyncClient(base_url=base_url, timeout=30.0) as client:
                  while True:
                      payload = await request_json(
                          client,
                          "GET",
                          "/workers",
                          token=token,
                          params={"page": 1, "size": 100, "status": "online"},
                      )
                      items = (extract_data(payload) or {}).get("items") or []
                      new_online = [
                          item for item in items if str(item.get("id")) not in baseline
                      ]
                      if new_online:
                          print(
                              "Gateway worker 心跳已上线:",
                              [item.get("id") for item in new_online],
                          )
                          return
                      if time.monotonic() > deadline:
                          raise SystemExit("Gateway worker 未在超时窗口内通过心跳上线")
                      await asyncio.sleep(POLL_INTERVAL_SECONDS)


          asyncio.run(main())
          PY
          docker rm -f antcode-worker-gateway-smoke
        env:
          ANTCODE_E2E_WEB_API_URL: http://127.0.0.1:8000

      - name: Dump stack diagnostics on failure
        if: failure()
        run: uv run --extra dev python scripts/annotate_e2e_diagnostics.py

      - name: Tear down stack
        if: always()
        run: |
          docker rm -f antcode-worker-gateway-smoke 2>/dev/null || true
          docker compose $COMPOSE_ARGS down -v --remove-orphans || true

  # ==================== Windows 产物安全 ====================
  windows-artifact-security:
    name: Windows Artifact Security
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://antcode:${{ github.run_id }}@localhost:5432/antcode_windows_tests
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --frozen

      - name: Run Windows artifact security tests
        shell: pwsh
        run: |
          $arguments = @(
            "run", "--extra", "dev", "pytest",
            "tests/unit/worker/test_artifact_io_windows.py",
            "tests/unit/worker/test_artifact_io_windows_real.py", "-q",
            "--junitxml=windows-artifact-results.xml"
          )
          $process = Start-Process uv -ArgumentList $arguments -NoNewWindow -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 60 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Windows artifact security tests exceeded 60 seconds"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

      - name: Annotate Windows artifact test failures
        if: failure() && hashFiles('windows-artifact-results.xml') != ''
        shell: pwsh
        run: |
          [xml]$report = Get-Content windows-artifact-results.xml
          $cases = @($report.testsuites.testsuite.testcase) + @($report.testsuite.testcase)
          foreach ($case in $cases) {
            $failure = if ($case.failure) { $case.failure } else { $case.error }
            if (-not $failure) { continue }
            $message = [string]$failure.'#text'
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows artifact test failed: $($case.name)::$message"
          }

  # ==================== 后端安全扫描 ====================
  backend-security:
    name: Backend Security & Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install dependencies
        run: uv sync --all-packages --extra dev --frozen

      - name: Run bandit security scan
        run: |
          rm -f bandit-report.json
          uv run bandit -r packages/ services/ scripts/ \
            --severity-level high --confidence-level high \
            --exit-zero -f json -o bandit-report.json
          test -s bandit-report.json

      - name: Block on HIGH severity bandit findings
        run: uv run --extra dev python scripts/fail_on_high_vulns.py bandit-report.json --tool bandit

      - name: Run pip-audit (deps CVE scan)
        run: |
          rm -f pip-audit-report.json
          # P1-CI-06: --all-packages 导出整个 workspace 全部成员的依赖闭包；
          # 只导出根包时实测 98 个依赖，完整 workspace 为 141 个，漏扫 43 个。
          uv export --locked --all-packages --extra dev --no-emit-workspace --no-hashes \
            --output-file audit-requirements.txt
          set +e
          uv run --extra dev pip-audit --strict --no-deps --disable-pip \
            --requirement audit-requirements.txt \
            --format=json --output=pip-audit-report.json
          scan_status=$?
          set -e
          test -s pip-audit-report.json
          if [ "$scan_status" -gt 1 ]; then
            exit "$scan_status"
          fi

      - name: Block on HIGH/CRITICAL pip-audit findings
        run: uv run --extra dev python scripts/fail_on_high_vulns.py pip-audit-report.json --tool pip-audit

      - name: Run mypy type check
        # J1: 去掉 || true 让 mypy 真正阻断 PR；type-check 存量白名单靠 mypy.ini
        # 里逐目录 ignore_errors=True 收敛，与 ruff 逐目录收紧同步节奏。
        run: uv run mypy packages services --ignore-missing-imports

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: error

  # ==================== 前端测试 ====================
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Run type check
        working-directory: web/antcode-frontend
        run: npm run type-check

      - name: Run lint
        working-directory: web/antcode-frontend
        run: npm run lint:ci

      - name: Run behavior tests
        working-directory: web/antcode-frontend
        run: npm run test:ci

  # ==================== 前端安全扫描 ====================
  frontend-security:
    name: Frontend Security
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Collect npm audit report
        working-directory: web/antcode-frontend
        run: |
          npm audit --json --audit-level=high > npm-audit-report.json || audit_status=$?
          test -s npm-audit-report.json
          if [ "${audit_status:-0}" -gt 1 ]; then
            exit "$audit_status"
          fi

      - name: Block unapproved HIGH/CRITICAL npm findings
        run: node scripts/check_npm_audit.mjs web/antcode-frontend/npm-audit-report.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report
          path: web/antcode-frontend/npm-audit-report.json
          if-no-files-found: error

  # ==================== 前端构建 ====================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/antcode-frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/antcode-frontend
        run: npm ci

      - name: Build
        working-directory: web/antcode-frontend
        run: npm run build

  # ==================== 摘要 ====================
  summary:
    name: CI Summary
    runs-on: ubuntu-24.04
    needs: [backend-lint, backend-test, e2e, backend-security, windows-artifact-security, frontend-test, frontend-security, frontend-build]
    if: always()

    steps:
      - name: Summary
        env:
          BACKEND_LINT_RESULT: ${{ needs.backend-lint.result }}
          BACKEND_TEST_RESULT: ${{ needs.backend-test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          BACKEND_SECURITY_RESULT: ${{ needs.backend-security.result }}
          WINDOWS_ARTIFACT_RESULT: ${{ needs.windows-artifact-security.result }}
          FRONTEND_TEST_RESULT: ${{ needs.frontend-test.result }}
          FRONTEND_SECURITY_RESULT: ${{ needs.frontend-security.result }}
          FRONTEND_BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 后端代码检查 | ${{ needs.backend-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端测试 | ${{ needs.backend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 端到端测试 | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 后端安全扫描 | ${{ needs.backend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows 产物安全 | ${{ needs.windows-artifact-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端 lint/type-check | ${{ needs.frontend-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端安全扫描 | ${{ needs.frontend-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 前端构建 | ${{ needs.frontend-build.result }} |" >> $GITHUB_STEP_SUMMARY
          checks=(
            "backend-lint=$BACKEND_LINT_RESULT"
            "backend-test=$BACKEND_TEST_RESULT"
            "e2e=$E2E_RESULT"
            "backend-security=$BACKEND_SECURITY_RESULT"
            "windows-artifact-security=$WINDOWS_ARTIFACT_RESULT"
            "frontend-test=$FRONTEND_TEST_RESULT"
            "frontend-security=$FRONTEND_SECURITY_RESULT"
            "frontend-build=$FRONTEND_BUILD_RESULT"
          )
          for check in "${checks[@]}"; do
            if [ "${check#*=}" != "success" ]; then
              echo "::error::Required job ${check%%=*} ended with ${check#*=}"
              exit 1
            fi
          done

  publish-images:
    name: Publish verified images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # 门禁语义：镜像发布必须被真实执行的 E2E（e2e job，compose 全栈真跑）阻断，
    # 而不是仅靠 pytest collect。
    needs: [backend-lint, backend-test, e2e, backend-security, windows-artifact-security, frontend-test, frontend-security, frontend-build]
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-build.yml
    secrets: inherit
