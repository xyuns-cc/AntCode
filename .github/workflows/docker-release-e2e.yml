name: Production Release Digest E2E

on:
  workflow_call:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/antcode

jobs:
  release-e2e:
    name: Exact production digest E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "0.8.17"
      - name: Install E2E dependencies
        run: uv sync --all-packages --extra dev --frozen
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download unsigned application digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-digest-*
          path: release-digests
          merge-multiple: true
      - name: Resolve locked runtime image digests
        id: runtime-images
        run: |
          set -euo pipefail
          lock=infra/docker/release-runtime-images.json
          jq -e '.schema_version == 1 and (.images | keys == ["postgres", "redis", "reverse-proxy"])' "$lock" >/dev/null
          printf 'postgres=%s\n' "$(jq -er '.images.postgres' "$lock")" >> "$GITHUB_OUTPUT"
          printf 'redis=%s\n' "$(jq -er '.images.redis' "$lock")" >> "$GITHUB_OUTPUT"
          printf 'reverse_proxy=%s\n' "$(jq -er '.images["reverse-proxy"]' "$lock")" >> "$GITHUB_OUTPUT"
      - name: Resolve locked runtime child digests
        id: runtime-children
        run: |
          set -euo pipefail
          resolve_children() {
            local output_prefix="$1" image_ref="$2" manifest repository arch digest
            local -A child_digests=()
            [[ "$image_ref" =~ ^[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]]
            manifest="$(docker buildx imagetools inspect "$image_ref" --raw)"
            for arch in amd64 arm64; do
              digest="$(jq -er --arg arch "$arch" '
                [.manifests[]
                  | select(.platform.os == "linux" and .platform.architecture == $arch)
                  | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                  | .digest]
                | if length == 1 then .[0] else error("expected exactly one linux/" + $arch + " manifest") end
              ' <<<"$manifest")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              child_digests["$arch"]="$digest"
            done
            [[ "${child_digests[amd64]}" != "${child_digests[arm64]}" ]]
            repository="${image_ref%@*}"
            for arch in amd64 arm64; do
              printf '%s_%s=%s@%s\n' \
                "$output_prefix" "$arch" "$repository" "${child_digests[$arch]}" >> "$GITHUB_OUTPUT"
            done
          }
          resolve_children postgres '${{ steps.runtime-images.outputs.postgres }}'
          resolve_children redis '${{ steps.runtime-images.outputs.redis }}'
          resolve_children reverse_proxy '${{ steps.runtime-images.outputs.reverse_proxy }}'
      - name: Scan locked PostgreSQL digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-images.outputs.postgres }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked PostgreSQL amd64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.postgres_amd64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked PostgreSQL arm64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.postgres_arm64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked Redis digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-images.outputs.redis }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked Redis amd64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.redis_amd64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked Redis arm64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.redis_arm64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked reverse-proxy digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-images.outputs.reverse_proxy }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked reverse-proxy amd64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.reverse_proxy_amd64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan locked reverse-proxy arm64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.runtime-children.outputs.reverse_proxy_arm64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Allow unprivileged user namespaces for Worker sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Prepare ephemeral production environment
        run: >-
          uv run python -m scripts.prepare_release_e2e
          --output-dir "$RUNNER_TEMP/antcode-release-e2e"
          --digest-dir release-digests
          --runtime-lock infra/docker/release-runtime-images.json
          --image-prefix "$IMAGE_PREFIX"
          --revision "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
      - name: Start isolated E2E Git source
        run: |
          nohup uv run python -m tests.e2e.git_http_server \
            --root "$ANTCODE_E2E_GIT_ROOT" --host 0.0.0.0 --port 18081 \
            > "$RELEASE_E2E_DIR/git-http.log" 2>&1 &
          echo "$!" > "$RELEASE_E2E_DIR/git-http.pid"
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:18081/ >/dev/null; do sleep 1; done'
      - name: Start exact production control and Worker images
        run: >-
          uv run python -m scripts.release_e2e_orchestrator
          --environment "$RELEASE_E2E_ENV_FILE"
          --state-dir "$RELEASE_E2E_DIR"
      - name: Verify HTTPS and Gateway mTLS
        run: >-
          uv run python -m scripts.verify_release_transport
          --ca "$RELEASE_E2E_DIR/public-ca.crt"
          --client-cert "$RELEASE_E2E_DIR/worker-tls/client.crt"
          --client-key "$RELEASE_E2E_DIR/worker-tls/client.key"
      - name: Run full Gateway production E2E including SSE
        run: uv run --extra dev pytest tests/e2e -q
      - name: Dump release stack diagnostics
        if: failure() && env.RELEASE_E2E_ENV_FILE != ''
        run: |
          docker compose --env-file "$RELEASE_E2E_ENV_FILE" -p antcode-release-control \
            -f infra/docker/docker-compose.prod.yml -f infra/docker/docker-compose.prod.ci-control.yml ps
          docker compose --env-file "$RELEASE_E2E_ENV_FILE" -p antcode-release-control \
            -f infra/docker/docker-compose.prod.yml -f infra/docker/docker-compose.prod.ci-control.yml logs --no-color --tail=500
          docker compose --env-file "$RELEASE_E2E_ENV_FILE" -p antcode-release-worker \
            -f infra/docker/docker-compose.prod.worker.yml -f infra/docker/docker-compose.prod.ci-worker.yml logs --no-color --tail=500
      - name: Tear down release stack
        if: always() && env.RELEASE_E2E_ENV_FILE != ''
        run: |
          status=0
          docker compose --env-file "$RELEASE_E2E_ENV_FILE" -p antcode-release-worker \
            -f infra/docker/docker-compose.prod.worker.yml -f infra/docker/docker-compose.prod.ci-worker.yml \
            down -v --remove-orphans || status=$?
          docker compose --env-file "$RELEASE_E2E_ENV_FILE" -p antcode-release-control \
            -f infra/docker/docker-compose.prod.yml -f infra/docker/docker-compose.prod.ci-control.yml \
            down -v --remove-orphans || status=$?
          if [ -f "$RELEASE_E2E_DIR/git-http.pid" ]; then
            kill "$(cat "$RELEASE_E2E_DIR/git-http.pid")" || status=$?
          fi
          exit "$status"
