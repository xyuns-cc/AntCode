name: Build and Scan Release Candidate

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/antcode

jobs:
  candidate:
    name: Candidate (${{ inputs.service }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest (untagged)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ inputs.service }},push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=gha,scope=${{ inputs.service }}
            type=gha,scope=${{ inputs.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}
          sbom: true
          provenance: mode=max
      - name: Resolve pushed platform digests
        id: platform-digests
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect --raw "${IMAGE}@${INDEX_DIGEST}" > pushed-index.json
          declare -A platform_digests
          for arch in amd64 arm64; do
            digest="$(jq -er --arg arch "$arch" '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == $arch)
                | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")
                | .digest]
              | if length == 1 then .[0] else error("expected exactly one linux/" + $arch + " manifest") end
            ' pushed-index.json)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            platform_digests[$arch]="$digest"
            printf '%s=%s\n' "$arch" "$digest" >> "$GITHUB_OUTPUT"
          done
          [[ "${platform_digests[amd64]}" != "${platform_digests[arm64]}" ]]
      - name: Scan pushed index digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}@${{ steps.push.outputs.digest }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan pushed amd64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}@${{ steps.platform-digests.outputs.amd64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Scan pushed arm64 child digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}-${{ inputs.service }}@${{ steps.platform-digests.outputs.arm64 }}
          scanners: vuln,secret
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: table
      - name: Write unsigned digest descriptor
        env:
          AMD64_DIGEST: ${{ steps.platform-digests.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platform-digests.outputs.arm64 }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail
          mkdir -p release-digests
          printf '%s\n' "$INDEX_DIGEST" > "release-digests/${SERVICE}.digest"
          jq -n --arg index "$INDEX_DIGEST" --arg amd64 "$AMD64_DIGEST" --arg arm64 "$ARM64_DIGEST" \
            '{schema_version: 1, index: $index, amd64: $amd64, arm64: $arm64}' \
            > "release-digests/${SERVICE}.platforms.json"
      - name: Upload unsigned digest descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ inputs.service }}
          path: release-digests/*
          if-no-files-found: error
          retention-days: 1
