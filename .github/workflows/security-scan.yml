name: Security Scan

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    # 每周一凌晨 2 点（UTC）跑一次，捕获新披露的 CVE
    - cron: '0 2 * * 1'

jobs:
  # ==================== Git 历史凭据扫描 ====================
  gitleaks:
    name: Gitleaks (Git history)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # ==================== Dockerfile 静态分析 ====================
  hadolint:
    name: Hadolint (Dockerfile lint)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/docker/Dockerfile.web_api
          - infra/docker/Dockerfile.master
          - infra/docker/Dockerfile.gateway
          - infra/docker/Dockerfile.worker
          - web/antcode-frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # DL3008/DL3013/DL3018：apt/pip/apk 版本未固定（仅警告，不阻断）
          ignore: DL3008,DL3013,DL3018
          failure-threshold: error

  # ==================== 仓库代码 & 依赖漏洞扫描 ====================
  trivy-fs:
    name: Trivy (filesystem & deps)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          scan-ref: .
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
