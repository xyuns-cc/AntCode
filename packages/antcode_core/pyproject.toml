[project]
name = "antcode_core"
version = "1.0.0"
description = "AntCode 共享核心包：通用配置、基础设施适配、领域模型"
requires-python = ">=3.11"
dependencies = [
    # 共享 protobuf 日志/任务传输契约
    "antcode-contracts>=1.0.0",
    # 数据库
    "tortoise-orm>=0.21.0",
    "asyncpg>=0.29.0",
    # 数据验证
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.14.2,<3",
    "python-dotenv>=1.2.2",
    # 身份认证
    "pyjwt>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=50.0.0",
    "filelock>=3.20.0",
    # 缓存
    "redis>=5.0.0",
    # 日志
    "loguru>=0.7.0",
    # 工具库
    "aiofiles>=23.0.0",
    "ujson>=5.13.0",
    "pytz>=2024.1",
    # 高性能序列化与压缩
    "msgpack>=1.2.1",
    "lz4>=4.3.0",
    # HTTP 客户端（alert channel / http_client 用）
    "httpx[http2]>=0.28.1",
    "h2>=4.4.1",
    # 系统监控（monitoring/system_metrics_service 用 psutil）
    "psutil>=5.9.0",
    # 定时任务调度（scheduler_service 用 apscheduler）
    "apscheduler>=3.10.0",
    # 上层 service 抛 HTTPException 用（core 里深度耦合 fastapi 异常类型）
    "fastapi>=0.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antcode_core"]

[tool.hatch.build.targets.sdist]
include = ["src/antcode_core"]
