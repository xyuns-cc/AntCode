# AntCode Worker 配置示例
#
# 推荐位置（新架构默认读取）：data/worker/worker_config.yaml
# 你可以复制此文件到该位置并按需修改。

# 基本配置
name: "Worker-001"
port: 8001                    # 健康检查端口
region: "默认"
version: "0.1.0"

# 传输模式: direct (Redis) 或 gateway (Gateway)
transport_mode: "gateway"

# Direct 仅用于可信内网、单租户测试，生产必须使用 Gateway。
# transport_mode=direct 时必填；Gateway Worker 不得持有该凭据。
redis_url: ""

# Gateway 模式配置（公网通过 Gateway）
gateway_host: "localhost"
gateway_port: 50051

# 控制平面 API 地址（用于安装 Key 注册）
api_base_url: "http://localhost:8000"


# 心跳配置
heartbeat_interval: 30        # 心跳间隔（秒）
heartbeat_timeout: 60         # 心跳超时（秒）

# 任务配置
# 自适应（值为 0）一律从**本进程的预算**推导，容器里就是 cgroup 的
# memory.max / cpu.max，不是宿主 /proc/meminfo 与 nproc（两者在容器里差一个
# 数量级）。探测不到 cgroup 时会退到宿主值并打 WARNING，启动日志的
# "内存预算=" 一栏写明来源。
# 生效的 max_concurrent_tasks × task_memory_limit_mb 必须放得进任务池
# （预算 × 70%），放不下直接拒绝启动——超卖的表现是任务被容器 cgroup 杀掉，
# 静默放过只会让运维追不到配置上。
max_concurrent_tasks: 0       # 最大并发（0=自动计算）
task_timeout: 3600            # 默认超时（秒）
task_cpu_time_limit_sec: 0    # CPU 时间限制（0=自动）
# 单任务内存限制（0=自动）。两层含义，别按"虚拟内存上限"理解：
#   1) RLIMIT_DATA 硬限——限可写数据段（brk + 私有可写映射），JVM/V8 的
#      PROT_NONE 地址预留不计入，所以这里填的是"真的会写下去的内存"；
#   2) 进程树 RSS 监控——按真实 RSS 采样，超限直接杀掉整棵进程树。
# MAP_SHARED 与 tmpfs 页只受 (2) 与容器级 mem_limit 约束，不受 (1) 约束。
task_memory_limit_mb: 0
auto_resource_limit: true     # 启用自适应资源限制

# 流控配置（可选）
flow_control_enabled: false
flow_control_strategy: "token_bucket"  # token_bucket/aimd/sliding_window
flow_control_rate: 100.0               # 令牌补充速率（请求/秒）
flow_control_capacity: 200             # 令牌桶容量

# 存储配置
data_dir: "data/worker"

# 凭证存储: persistent（data/worker/secrets/worker_credentials.json，0600）
credential_store: "persistent"
