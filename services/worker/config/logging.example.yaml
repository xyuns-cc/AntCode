# AntCode Worker 日志配置示例

# 日志级别: DEBUG, INFO, WARNING, ERROR
level: "INFO"

# 日志格式
format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"

# 控制台输出
console:
  enabled: true
  level: "INFO"
  colorize: true

# 文件输出已禁用；任务日志通过 Redis 实时流与 PostgreSQL 持久化。
file:
  enabled: false
  level: "DEBUG"

# 结构化日志（JSON）
json:
  enabled: false
